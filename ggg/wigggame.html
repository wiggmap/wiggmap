<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WiggGame</title>
  <link rel="icon" href="../assets/favicon.ico" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#040f09">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #040f09; --bg2: #061a10; --text: #e8efe8;
      --muted: rgba(255,255,255,0.35); --border: rgba(255,255,255,0.08);
      --shadow: 0 16px 48px rgba(0,0,0,0.4);
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
      --accent: #1dd876; --accent2: #1dd876; --accent3: #0d8f50;
      --danger: #e74c3c; --success: #27ae60;
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html,body {
      margin:0; padding:0; height:100%; overflow:hidden;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:var(--text);
      background: radial-gradient(ellipse 80% 40% at 50% -10%, rgba(29,216,118,0.18) 0%, transparent 70%), #040f09;
    }
    body { display:flex; flex-direction:column; }
    .wrap { max-width:1080px; width:100%; margin:0 auto; padding:10px 16px; height:100vh; max-height:100vh; overflow:hidden; display:flex; flex-direction:column; gap:8px; }

    /* LANG BAR */
    .langBar { display:flex; justify-content:flex-end; gap:6px; flex-shrink:0; }
    .langBtn { border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04); border-radius:8px; padding:5px 10px; font-size:13px; font-weight:800; cursor:pointer; transition:all 0.15s ease; color:rgba(255,255,255,0.5); }
    .langBtn:hover { border-color:var(--accent); color:var(--accent); }
    .langBtn.active { border-color:var(--accent); background:rgba(29,216,118,0.12); color:var(--accent); }

    /* HEADER */
    .header { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; flex-shrink:0; }
    .header > a { flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; padding:2px; border-radius:16px; background:transparent; border:0; }
    .logo { width:clamp(180px,24vw,320px); max-height:70px; height:auto; display:block; object-fit:contain; filter:drop-shadow(0 12px 32px rgba(29,216,118,0.4)); cursor:pointer; transition:transform 0.2s ease; }
    .logo:hover { transform:translateY(-2px); }

    /* LEVEL BADGE */
    .levelBadge { display:flex; align-items:center; gap:6px; padding:4px 14px; background:rgba(29,216,118,0.12); border:1px solid rgba(29,216,118,0.35); border-radius:999px; font-size:12px; font-weight:900; color:#1dd876; }

    /* STATS */
    .statsBar { display:flex; flex-direction:row; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; position:relative; overflow:visible; flex-shrink:0; }
    .stat { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 10px; border-radius:12px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); min-width:70px; }
    .stat .label { color:rgba(255,255,255,0.35); font-weight:700; font-size:9px; text-transform:uppercase; letter-spacing:0.5px; }
    .stat .value { font-size:18px; font-weight:950; color:#1dd876; }
    .stat:nth-child(2) .value { color:#f59e0b; }
    .stat:nth-child(4) .value { color:rgba(255,255,255,0.7); }
    .livesContainer { position:relative; overflow:visible !important; }
    .livesDisplay { display:flex; gap:6px; align-items:center; }
    .lifeHeart { width:auto; height:auto; border-radius:0; background:none; box-shadow:none; font-size:18px; line-height:1; animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1); transition:all 0.2s ease; }
    .lifeHeart::after { content:"❤️"; }
    .lifeHeart.lost { opacity:0.2; filter:grayscale(1); animation:popOut 0.2s ease; }
    .lifeHeart.lost::after { content:"🖤"; }
    @keyframes popIn { from{transform:scale(0) rotate(-180deg);opacity:0;} to{transform:scale(1) rotate(0);opacity:1;} }
    @keyframes popOut { to{transform:scale(0.5);opacity:0;} }
    .bonusIndicator { position:absolute; top:-24px; left:50%; transform:translateX(-50%); font-size:20px; font-weight:900; color:var(--accent); white-space:nowrap; animation:floatUp 1.4s ease-out forwards; pointer-events:none; z-index:50; text-shadow:0 2px 12px rgba(29,216,118,0.5); }
    @keyframes floatUp { 0%{transform:translateX(-50%) translateY(0) scale(1);opacity:1;} 60%{opacity:1;} 100%{transform:translateX(-50%) translateY(-48px) scale(1.2);opacity:0;} }

    /* LEVEL UP POPUP */
    .levelUpOverlay { display:none; position:fixed; inset:0; place-items:center; z-index:300; pointer-events:none; }
    .levelUpOverlay.show { display:grid; }
    .levelUpBox { background:linear-gradient(135deg,#0a2818,#0d3520); border:2px solid rgba(29,216,118,0.4); border-radius:20px; padding:32px 48px; text-align:center; box-shadow:0 24px 64px rgba(29,216,118,0.25), 0 0 120px rgba(29,216,118,0.1); animation:levelPopIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    @keyframes levelPopIn { from{opacity:0;transform:scale(0.7);} to{opacity:1;transform:scale(1);} }
    .levelUpEmoji { font-size:52px; line-height:1; margin-bottom:8px; }
    .levelUpTitle { font-size:13px; font-weight:800; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
    .levelUpName  { font-size:28px; font-weight:950; color:#1dd876; }
    .levelUpSub   { font-size:13px; color:rgba(255,255,255,0.4); font-weight:700; margin-top:6px; }

    /* GAME BOARD */
    .gameBoard { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; flex:1; min-height:0; }
    .boardHeader { padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.03); flex-wrap:wrap; flex-shrink:0; }
    .headerLeft { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .badge { padding:7px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.06); font-weight:800; font-size:11px; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.4px; }
    .progressSection { display:flex; align-items:center; gap:12px; flex-grow:1; min-width:200px; }
    .progressBar { height:6px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden; border:1px solid rgba(255,255,255,0.08); flex-grow:1; }
    .progressFill { height:100%; width:0%; background:linear-gradient(90deg,#1dd876,#10a860); transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 0 12px rgba(29,216,118,0.4); }
    .progressLabel { font-weight:850; font-size:11px; color:rgba(255,255,255,0.35); white-space:nowrap; letter-spacing:0.3px; }
    .stage { padding:14px 16px; display:flex; flex-direction:column; gap:12px; flex:1; justify-content:space-between; overflow:hidden; min-height:0; }
    .questionBox { position:relative; border-radius:16px; padding:18px 20px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); animation:slideInQuestion 0.35s cubic-bezier(0.34,1.56,0.64,1); flex-shrink:0; }
    @keyframes slideInQuestion { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
    .qNumber { font-size:11px; font-weight:800; color:#1dd876; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:4px; }
    .qTitle { font-size:20px; font-weight:600; letter-spacing:-0.3px; line-height:1.35; margin:0; color:#ffffff; }
    .qMeta { margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12px; font-weight:750; }
    .status { color:rgba(255,255,255,0.35); transition:color 0.2s ease; }
    .status.correct { color:var(--accent); font-weight:900; }
    .status.wrong   { color:var(--danger); font-weight:900; }
    .answersGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; animation:fadeInAnswers 0.3s ease; flex-shrink:0; }
    @keyframes fadeInAnswers { from{opacity:0;} to{opacity:1;} }
    .answerBtn { position:relative; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); border-radius:12px; padding:12px 12px; display:flex; align-items:center; justify-content:flex-start; gap:10px; cursor:pointer; font-weight:700; font-size:15px; letter-spacing:-0.2px; color:rgba(255,255,255,0.9); transition:all 0.12s ease; text-align:left; overflow:hidden; width:100%; min-height:60px; }
    .answerBtn:hover:not(.locked) { border-color:#1dd876; background:rgba(29,216,118,0.1); box-shadow:0 8px 24px rgba(29,216,118,0.15); transform:translateY(-2px); }
    .answerBtn:active:not(.locked) { transform:translateY(-1px); }
    .answerBtn.locked { pointer-events:none; }
    .answerBtn.correct { border-color:#1dd876; background:rgba(29,216,118,0.18); box-shadow:0 0 0 2px rgba(29,216,118,0.2), 0 0 24px rgba(29,216,118,0.1); }
    .answerBtn.correct .answerLetter { background:#1dd876; color:#021a0a; box-shadow:0 4px 16px rgba(29,216,118,0.4); }
    .answerBtn.wrong { border-color:var(--danger); background:rgba(231,76,60,0.12); box-shadow:0 0 0 2px rgba(231,76,60,0.15); }
    .answerBtn.wrong .answerLetter { background:var(--danger); color:#fff; box-shadow:0 4px 16px rgba(231,76,60,0.35); }
    .answerLetter { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; color:#1dd876; background:rgba(29,216,118,0.15); border:1px solid rgba(29,216,118,0.25); flex-shrink:0; transition:all 0.12s ease; }
    .answerBtn:hover:not(.locked) .answerLetter { background:rgba(29,216,118,0.25); transform:scale(1.08); }
    .answerText { flex:1; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

    /* TF BUTTONS */
    .tfGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; animation:fadeInAnswers 0.3s ease; flex-shrink:0; }
    .tfBtn { position:relative; border:none; border-radius:14px; padding:14px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; font-weight:700; font-size:20px; min-height:80px; transition:all 0.15s ease; width:100%; overflow:hidden; }
    .tfBtn:hover:not(.locked) { transform:translateY(-3px); filter:brightness(1.1); }
    .tfBtn:active:not(.locked) { transform:translateY(-1px); }
    .tfBtn.locked { pointer-events:none; }
    .tfBtn .tfIcon { font-size:28px; font-weight:950; line-height:1; }
    .tfBtn .tfLabel { font-size:16px; font-weight:800; letter-spacing:0.3px; }
    .tfBtn.true-btn { background:#1dd876; color:#021a0a; box-shadow:0 4px 24px rgba(29,216,118,0.3); }
    .tfBtn.true-btn:hover:not(.locked) { box-shadow:0 8px 32px rgba(29,216,118,0.45); }
    .tfBtn.false-btn { background:#e74c3c; color:#ffffff; box-shadow:0 4px 24px rgba(231,76,60,0.3); }
    .tfBtn.false-btn:hover:not(.locked) { box-shadow:0 8px 32px rgba(231,76,60,0.45); }
    .tfBtn.correct { box-shadow:0 0 0 4px rgba(29,216,118,0.4), 0 4px 24px rgba(29,216,118,0.4); animation:tfCorrectPop 0.3s ease; }
    .tfBtn.wrong { animation:tfWrongShake 0.4s ease; }
    @keyframes tfCorrectPop { 0%{transform:scale(1);} 50%{transform:scale(1.05);} 100%{transform:scale(1);} }
    @keyframes tfWrongShake { 0%{transform:translateX(0);} 15%{transform:translateX(-8px);} 30%{transform:translateX(8px);} 45%{transform:translateX(-6px);} 60%{transform:translateX(6px);} 75%{transform:translateX(-3px);} 100%{transform:translateX(0);} }

    /* QUESTION TIMER BAR */
    .qTimerWrap { height:4px; background:rgba(255,255,255,0.04); overflow:hidden; }
    .qTimerFill { height:100%; width:100%; transform-origin:left; background:#1dd876; transition:none; }
    .qTimerFill.running { transition:width linear; }
    .qTimerFill.warn { background:#f59e0b; }
    .qTimerFill.danger { background:var(--danger); }

    /* TYPE TAG VARIANTS */
    .badge.typeTF { background:rgba(245,158,11,0.15); border-color:#f59e0b; color:#f59e0b; }
    .badge.typeMCQ { background:rgba(29,216,118,0.12); border-color:#1dd876; color:#1dd876; }

    /* SCORE POP */
    @keyframes scorePop { 0%{transform:scale(1);} 40%{transform:scale(1.3);} 100%{transform:scale(1);} }
    .score-pop { animation:scorePop 0.3s ease; }

    /* COMBO PULSE */
    @keyframes comboPulse { 0%{transform:scale(1);opacity:1;} 50%{transform:scale(1.15);opacity:0.9;} 100%{transform:scale(1);opacity:1;} }
    .combo-hot { color:#f59e0b !important; animation:comboPulse 0.5s ease; }

    /* WRONG FLASH OVERLAY */
    .wrongFlash { position:fixed; inset:0; background:rgba(231,76,60,0.08); pointer-events:none; z-index:90; opacity:0; transition:opacity 0.15s ease; }
    .wrongFlash.show { opacity:1; }

    /* CONFETTI */
    .confettiContainer { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:95; overflow:hidden; }
    .confettiPiece { position:absolute; top:-10px; width:8px; height:8px; border-radius:2px; animation:confettiFall 1.2s ease-out forwards; }
    @keyframes confettiFall { 0%{transform:translateY(0) rotate(0deg);opacity:1;} 100%{transform:translateY(100vh) rotate(720deg);opacity:0;} }

    /* TOAST */
    .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(120px); width:min(520px,calc(100vw - 32px)); border-radius:16px; padding:16px 20px; display:flex; flex-direction:column; gap:6px; z-index:200; transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1),opacity 0.3s ease; opacity:0; pointer-events:none; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    .toast.hide { transform:translateX(-50%) translateY(120px); opacity:0; }
    .toast.correct-toast { background:rgba(29,216,118,0.12); border:1px solid rgba(29,216,118,0.25); box-shadow:0 12px 40px rgba(0,0,0,0.4), 0 0 40px rgba(29,216,118,0.08); backdrop-filter:blur(16px); }
    .toast.wrong-toast   { background:rgba(231,76,60,0.1); border:1px solid rgba(231,76,60,0.2); box-shadow:0 12px 40px rgba(0,0,0,0.4); backdrop-filter:blur(16px); }
    .toastVerdict { font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:0.6px; }
    .toast.correct-toast .toastVerdict { color:#1dd876; }
    .toast.wrong-toast   .toastVerdict { color:#e74c3c; }
    .toastText { font-size:14px; font-weight:600; line-height:1.55; color:rgba(255,255,255,0.8); }
    .toastTimer { height:3px; border-radius:999px; background:rgba(255,255,255,0.06); margin-top:4px; overflow:hidden; }
    .toastTimerFill { height:100%; border-radius:999px; width:100%; }
    .toast.correct-toast .toastTimerFill { background:#1dd876; }
    .toast.wrong-toast   .toastTimerFill { background:#e74c3c; }
    .toastTimerFill.running { transition:width 14s linear; width:0%; }

    /* CONTROLS */
    .controls { padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.02); flex-wrap:wrap; flex-shrink:0; }
    .hint { font-size:12px; font-weight:750; color:rgba(255,255,255,0.3); flex-grow:1; }
    .ctrlButtons { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .btn { border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.06); border-radius:10px; padding:10px 14px; font-weight:800; font-size:13px; cursor:pointer; transition:all 0.12s ease; letter-spacing:-0.2px; text-decoration:none; color:rgba(255,255,255,0.85); display:inline-flex; align-items:center; gap:6px; }
    .btn:hover { border-color:var(--accent); background:rgba(255,255,255,0.1); transform:translateY(-2px); }
    .btn.primary { border-color:rgba(29,216,118,0.4); background:rgba(29,216,118,0.12); color:#1dd876; font-weight:850; }
    .btn.primary:hover { background:rgba(29,216,118,0.2); }
    .btn.share { border-color:rgba(29,155,240,0.3); background:rgba(29,155,240,0.1); color:#5ab7f5; }
    .btn.share:hover { background:rgba(29,155,240,0.18); }
    .link { color:#1dd876; text-decoration:none; font-weight:800; border-bottom:2px solid rgba(29,216,118,0.4); transition:all 0.12s ease; cursor:pointer; padding:8px 10px; border-radius:6px; }
    .link:hover { background:rgba(29,216,118,0.1); }

    /* MODAL */
    .modal { display:none; position:fixed; inset:0; place-items:center; padding:16px; background:rgba(4,15,9,0.92); backdrop-filter:blur(12px); z-index:100; }
    .modal.show { display:grid; }
    .modalBox { width:min(580px,100%); border-radius:20px; background:#0a1f13; border:1px solid rgba(29,216,118,0.2); box-shadow:0 24px 64px rgba(0,0,0,0.5), 0 0 80px rgba(29,216,118,0.08); overflow:hidden; animation:popInModal 0.3s cubic-bezier(0.34,1.56,0.64,1); max-height:90vh; overflow-y:auto; }
    @keyframes popInModal { from{opacity:0;transform:scale(0.94);} to{opacity:1;transform:scale(1);} }
    .modalHeader { padding:24px; background:rgba(29,216,118,0.06); border-bottom:1px solid rgba(255,255,255,0.08); }
    .modalHeader h2 { margin:0; font-size:22px; font-weight:950; color:#ffffff; }
    .modalHeader p { margin:8px 0 0 0; color:rgba(255,255,255,0.4); font-weight:800; font-size:13px; line-height:1.4; }
    .modalBody { padding:24px; display:grid; gap:16px; }
    .resultBox { text-align:center; padding:20px; border-radius:14px; background:rgba(29,216,118,0.08); border:1px solid rgba(29,216,118,0.2); }
    .resultScore { font-size:56px; font-weight:950; color:#1dd876; line-height:1; margin-bottom:4px; text-shadow:0 0 40px rgba(29,216,118,0.3); }
    .resultRank  { font-size:20px; font-weight:850; margin-bottom:6px; color:rgba(255,255,255,0.85); }
    .resultLabel { color:rgba(255,255,255,0.35); font-size:12px; font-weight:750; text-transform:uppercase; letter-spacing:0.5px; }

    /* LEADERBOARD */
    .leaderboard { border-radius:12px; border:1px solid rgba(255,255,255,0.08); overflow:hidden; }
    .leaderboardTitle { padding:10px 14px; background:rgba(29,216,118,0.06); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; color:rgba(255,255,255,0.4); border-bottom:1px solid rgba(255,255,255,0.06); }
    .lbRow { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13px; font-weight:750; color:rgba(255,255,255,0.7); }
    .lbRow:last-child { border-bottom:none; }
    .lbRow.current { background:rgba(29,216,118,0.08); font-weight:900; color:#fff; }
    .lbRank { font-weight:950; color:rgba(255,255,255,0.4); width:20px; text-align:center; }
    .lbScore { margin-left:auto; font-weight:900; color:#1dd876; }
    .lbDate { color:rgba(255,255,255,0.3); font-size:11px; }
    .modalButtons { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }

    /* PWA INSTALL BANNER */
    .pwaBanner {
      position: fixed;
      bottom: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, calc(100vw - 24px));
      border-radius: 18px;
      background: rgba(10,31,19,0.95);
      border: 1px solid rgba(29,216,118,0.3);
      box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 60px rgba(29,216,118,0.08);
      backdrop-filter: blur(16px);
      z-index: 500;
      transition: bottom 0.5s cubic-bezier(0.34,1.56,0.64,1);
      overflow: hidden;
    }
    .pwaBanner.show { bottom: 20px; }
    .pwaBannerContent {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
    }
    .pwaBannerIcon {
      font-size: 32px;
      flex-shrink: 0;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(29,216,118,0.12);
      border-radius: 14px;
      border: 1px solid rgba(29,216,118,0.25);
    }
    .pwaBannerText { flex: 1; min-width: 0; }
    .pwaBannerTitle {
      font-weight: 900;
      font-size: 15px;
      color: #ffffff;
      letter-spacing: -0.2px;
    }
    .pwaBannerSub {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }
    .pwaBannerBtn {
      flex-shrink: 0;
      border: none;
      background: #1dd876;
      color: #021a0a;
      font-weight: 900;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(29,216,118,0.35);
      transition: all 0.15s ease;
      letter-spacing: -0.2px;
    }
    .pwaBannerBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(29,216,118,0.5); }
    .pwaBannerClose {

/* ══ CONSTANTS ══ */

/* ══ STATE ══ */
let bank=[], deck=[], current=null, qIndex=0;
let lives=3, maxLives=3, score=0, combo=0, streak=0, wrongCount=0;
let gameActive=false;
let lang = localStorage.getItem(LANG_KEY) || "en";
let seenIdxs = new Set(); // questions already seen this session
let _qTimer = null; // question timer interval ID
const Q_TIME = 19; // seconds per question

};

/* ══ TRANSLATION HELPER ══ */
function tr() { return LANGS[lang] || LANGS.en; }

  const T = tr();

  el.lCombo.textContent    = T.combo;

}

function setLang(l) {
  lang = l;

  if (document.getElementById('startScreen').classList.contains('show')) {
    sessionStorage.removeItem('wigg_started');
  }
  applyTranslations();
  init();
}

/* ══ LEVELS ══ */
function getLevel(s) { return Math.min(Math.floor(s/20)+1, 5); }

function getRankInfo(s) {
  const T = tr();
  const lv = getLevel(s);
  const i  = lv - 1;
  return { lv, i, emoji: T.emojis[i], title: T.titles[i] };
}

function updateLevelBadge() {
  const { lv, emoji, title } = getRankInfo(score);
  el.levelBadge.textContent = `${emoji} ${title} — Lv.${lv}`;
}

function checkLevelUp(oldScore, newScore) {
  if (getLevel(newScore) > getLevel(oldScore)) showLevelUp(getLevel(newScore));
}

/* ══ DIFFICULTY PROGRESSIVE — NO REPEAT ══
   Each question appears exactly once per cycle.
   When all questions have been seen, the session resets and a new cycle begins.
   Within each cycle, questions are ordered so the right difficulty appears first
   (deck.pop() takes from the END, so higher-priority questions go at the end).
══ */
function buildDeck() {
  const lv = getLevel(score);

  // Only unseen questions; if all seen, start a fresh cycle
  let available = bank.filter(q => !seenIdxs.has(q._idx));
  if (available.length === 0) {
    seenIdxs.clear();
    available = [...bank];
  }

  // Compute a priority weight for each question at the current level
  available.forEach(q => {
    const d = q.difficulty || 1;
    let w;
    if      (lv <= 1) w = d===1 ? 4 : d===2 ? 2 : 1;
    else if (lv === 2) w = d===2 ? 4 : 2;
    else if (lv === 3) w = d>=2  ? 3 : 1;
    else              w = d>=2  ? 4 : 1;
    q._weight = w;
  });

  // Sort so higher-priority (higher weight) questions land at the END
  // (since we use deck.pop(), those come first). Within same weight, shuffle.
  available.sort((a, b) => {
    const diff = a._weight - b._weight;
    return diff !== 0 ? diff : Math.random() - 0.5;
  });

  // Interleave tf and mcq for variety (preserving weight order within each group)
  const tfQ  = available.filter(q => q.type === "tf");
  const mcqQ = available.filter(q => q.type !== "tf");
  const interleaved = [];
  let ti = 0, mi = 0;
  while (ti < tfQ.length || mi < mcqQ.length) {
    if (ti < tfQ.length) interleaved.push(tfQ[ti++]);
    if (mi < mcqQ.length) interleaved.push(mcqQ[mi++]);
  }

  return interleaved; // each question exactly once
}

/* ══ LEADERBOARD ══ */
function getLB() { try { return JSON.parse(localStorage.getItem(LB_KEY)||"[]"); } catch { return []; } }
function saveLB(lb) { localStorage.setItem(LB_KEY, JSON.stringify(lb)); }

function addToLB(s) {
  const { emoji, title } = getRankInfo(s);
  const entry = { score:s, rank:`${emoji} ${title}`, date:new Date().toLocaleDateString() };
  const lb = getLB();
  lb.push(entry);
  lb.sort((a,b)=>b.score-a.score);
  const top5 = lb.slice(0,5);
  saveLB(top5);
  return top5;
}

function renderLB(currentScore) {
  const lb = getLB();
  if (!lb.length) { el.leaderboard.style.display="none"; return; }
  el.leaderboard.style.display = "block";
  const medals = ["🥇","🥈","🥉","4️⃣","5️⃣"];
  // mark the first entry matching current score as "current"
  let marked = false;
  el.leaderboard.innerHTML = `
    <div class="leaderboardTitle">${tr().lbTitle}</div>
    ${lb.map((e,i) => {
      const isCurrent = !marked && e.score === currentScore;
      if (isCurrent) marked = true;
      return `<div class="lbRow ${isCurrent?"current":""}">
        <span class="lbRank">${medals[i]||i+1}</span>
        <span>${e.rank}</span>
        <span class="lbDate">${e.date}</span>
        <span class="lbScore">${e.score} pts</span>
      </div>`;
    }).join("")}
  `;
}

/* ══ SHARE ══ */
function shareScore() {
  const { emoji, title } = getRankInfo(score);
  const text = tr().shareText(score, `${emoji} ${title}`);
  if (navigator.share) {
    navigator.share({ title:"WiggGame", text });
  } else {
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, "_blank");
  }
}

/* ══ GAME LOGIC ══ */
function shuffle(arr) {
  for (let i=arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function setLives() {
  el.livesDisplay.innerHTML = "";
  for (let i=0; i<maxLives; i++) {
    const h = document.createElement("div");
    h.className = `lifeHeart ${i>=lives?"lost":""}`;
    el.livesDisplay.appendChild(h);
  }
}

function gainBonus(label) {
  const container = el.livesDisplay.parentElement;
  const b = document.createElement("div");
  b.className = "bonusIndicator";
  b.textContent = label || "+1";
  container.appendChild(b);
  setTimeout(() => b.remove(), 1400);
}

function updateStats() {
  el.score.textContent = score;
  el.combo.textContent = combo + "x";
  el.streak.textContent = streak;
  el.streakFill.style.width = `${(streak/10)*100}%`;
  setLives();
  el.best.textContent = Number(localStorage.getItem(BEST_KEY)||"0");
  updateLevelBadge();
}

function normalizeQuestion(q, idx) {
  const T = tr();
  const out = {...q};
  out._idx = idx; // unique identifier for this question in the bank
  if (!out.type) out.type = "mcq";
  if (!out.category) out.category = "General";
  if (typeof out.explain !== "string") out.explain = "";
  if (!out.question) out.question = "?";
  if (out.type === "tf") {
    out.choices = [T.tf_true, T.tf_false];
    if (typeof out.correct !== "number") out.correct = 0;
  } else {
    if (!Array.isArray(out.choices)||out.choices.length<2) out.choices=["A","B","C","D"];
    if (typeof out.correct !== "number") out.correct = 0;
    if (out.choices.length>4) out.choices = out.choices.slice(0,4);
  }
  return out;
}

function pickNext() {
  if (deck.length===0) deck = buildDeck();
  current = deck.pop();
  if (current) seenIdxs.add(current._idx); // mark as seen this session
  qIndex++;
}

function stopQTimer() {
  if (_qTimer) { clearInterval(_qTimer); _qTimer = null; }
  el.qTimerFill.classList.remove("running","warn","danger");
}

function startQTimer() {
  stopQTimer();
  el.qTimerFill.style.width = "100%";
  el.qTimerFill.className = "qTimerFill";
  const start = performance.now();
  const duration = Q_TIME * 1000;
  void el.qTimerFill.offsetWidth; // force reflow
  el.qTimerFill.classList.add("running");
  el.qTimerFill.style.transitionDuration = Q_TIME + "s";
  el.qTimerFill.style.width = "0%";

  _qTimer = setInterval(() => {
    const elapsed = performance.now() - start;
    const pct = 1 - elapsed / duration;
    // color transitions
    if (pct <= 0.2) { el.qTimerFill.classList.add("danger"); el.qTimerFill.classList.remove("warn"); }
    else if (pct <= 0.5) { el.qTimerFill.classList.add("warn"); el.qTimerFill.classList.remove("danger"); }
    // timeout
    if (elapsed >= duration) {
      stopQTimer();
      if (gameActive) handleTimeout();
    }
  }, 200);
}

function handleTimeout() {
  if (!current || !gameActive) return;
  gameActive = false;
  const T = tr();
  // treat as wrong answer
  wrongCount += 1;
  combo = 0; streak = 0;
  if (wrongCount >= 3) { lives -= 1; wrongCount = 0; }
  // highlight correct answer
  const correctIdx = current._shuffledCorrect ?? current.correct;
  document.querySelectorAll(".answerBtn, .tfBtn").forEach((btn, i) => {
    btn.classList.add("locked");
    if (i === correctIdx) btn.classList.add("correct");
  });
  el.status.className = "status wrong";
  el.status.textContent = T.timeout;
  showWrongFlash();
  updateStats();

  el.toast.className = "toast wrong-toast";
  el.toastVerdict.textContent = T.timeout;
  el.toastText.textContent = current.explain || "";
  el.toastText.style.display = current.explain ? "block" : "none";
  requestAnimationFrame(() => {
    el.toast.classList.add("show");
    el.toastTimerFill.classList.remove("running");
    void el.toastTimerFill.offsetWidth;
    el.toastTimerFill.classList.add("running");
  });
  const nextAction = lives <= 0 ? endGame : () => { pickNext(); render(); };
  setTimeout(() => {
    el.toast.classList.add("hide"); el.toast.classList.remove("show");
    setTimeout(nextAction, 350);
  }, 14000);
}

function showWrongFlash() {
  el.wrongFlash.classList.add("show");
  setTimeout(() => el.wrongFlash.classList.remove("show"), 300);
}

function showConfetti() {
  const colors = ["#1dd876","#27ae60","#2ecc71","#10a860"];
  for (let i = 0; i < 4; i++) {
    const p = document.createElement("div");
    p.className = "confettiPiece";
    p.style.left = (15 + Math.random() * 70) + "%";
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random() * 0.3) + "s";
    el.confettiContainer.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}

function render() {
  if (!current) return;
  const T = tr();

  // Type tag styling
  el.typeTag.textContent = T.typeTag(current.type);
  el.typeTag.className = "badge " + (current.type === "tf" ? "typeTF" : "typeMCQ");
  el.catTag.textContent  = current.category || "General";
  el.diffTag.textContent = T.diffTag(current.difficulty||1);
  el.qNumberLabel.innerHTML = `${T.questionLabel} <span id="qNumber">${qIndex}</span>`;
  el.question.textContent = current.question;
  el.status.className = "status";
  el.status.textContent = T.pickAnswer;
  el.hint.textContent = "";
  el.toast.classList.remove("show","hide");
  el.toast.classList.add("hide");
  el.remaining.textContent = deck.length;
  el.answersGrid.innerHTML = "";

  if (current.type === "tf") {
    // TF: two large True/False buttons
    const indices = [0, 1];
    // shuffle the two choices
    if (Math.random() > 0.5) { indices.reverse(); }
    const shuffled = indices.map(i => current.choices[i]);
    current._shuffledCorrect = indices.indexOf(current.correct);

    el.answersGrid.className = "tfGrid";
    shuffled.forEach((choice, idx) => {
      const isTrue = choice === T.tf_true;
      const btn = document.createElement("button");
      btn.className = "tfBtn " + (isTrue ? "true-btn" : "false-btn");
      btn.type = "button";
      btn.innerHTML = `<span class="tfIcon">${isTrue ? "✓" : "✕"}</span><span class="tfLabel">${choice}</span>`;
      btn.addEventListener("click", () => answer(idx));
      el.answersGrid.appendChild(btn);
    });
  } else {
    // MCQ: standard 4-button grid
    el.answersGrid.className = "answersGrid";
    const letters = ["A","B","C","D"];
    const indices = current.choices.map((_,i)=>i);
    for (let i=indices.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [indices[i],indices[j]] = [indices[j],indices[i]];
    }
    const shuffled = indices.map(i=>current.choices[i]);
    current._shuffledCorrect = indices.indexOf(current.correct);

    shuffled.forEach((choice, idx) => {
      const btn = document.createElement("button");
      btn.className = "answerBtn";
      btn.type = "button";
      btn.innerHTML = `<div class="answerLetter">${letters[idx]||"•"}</div><div class="answerText">${choice}</div>`;
      btn.addEventListener("click", () => answer(idx));
      el.answersGrid.appendChild(btn);
    });
  }

  updateStats();
  startQTimer();
  gameActive = true;
}

function answer(idx) {
  if (!current || !gameActive) return;
  gameActive = false;
  stopQTimer();
  const T = tr();
  const correctIdx = current._shuffledCorrect ?? current.correct;
  const btnSelector = current.type === "tf" ? ".tfBtn" : ".answerBtn";
  document.querySelectorAll(btnSelector).forEach((btn,i) => {
    btn.classList.add("locked");
    if (i===correctIdx) btn.classList.add("correct");
    if (i===idx && i!==correctIdx) btn.classList.add("wrong");
  });

  const ok = idx === correctIdx;
  const oldScore = score;

  if (ok) {
    score += 1; combo += 1; streak += 1;
    // Score pop animation
    el.score.classList.remove("score-pop");
    void el.score.offsetWidth;
    el.score.classList.add("score-pop");
    // Combo pulse if >= 3
    if (combo >= 3) {
      el.combo.classList.remove("combo-hot");
      void el.combo.offsetWidth;
      el.combo.classList.add("combo-hot");
    }
    if (streak >= 10) {
      lives += 1;
      maxLives = Math.max(maxLives, lives);
      gainBonus("+1 ❤️");
      showConfetti();
      el.status.className = "status correct";
      el.status.textContent = T.streakLife;
      streak = 0; combo = 0;
    } else {
      el.status.className = "status correct";
      el.status.textContent = combo>=5 ? T.comboMsg(combo) : T.correct;
    }
    checkLevelUp(oldScore, score);
  } else {
    wrongCount += 1;
    combo = 0; streak = 0;
    if (wrongCount >= 3) {
      lives -= 1;
      wrongCount = 0;
    }
    el.status.className = "status wrong";
    el.status.textContent = T.wrong;
    showWrongFlash();
  }

  updateStats();

  const hasExplain = current.explain && current.explain.trim();
  el.toast.className = "toast " + (ok ? "correct-toast" : "wrong-toast");
  el.toastVerdict.textContent = ok ? T.correct : T.wrong;
  el.toastText.textContent = hasExplain ? current.explain : "";
  el.toastText.style.display = hasExplain ? "block" : "none";

  requestAnimationFrame(() => {
    el.toast.classList.add("show");
    el.toastTimerFill.classList.remove("running");
    void el.toastTimerFill.offsetWidth;
    el.toastTimerFill.classList.add("running");
  });

  const nextAction = lives<=0 ? endGame : ()=>{ pickNext(); render(); };
  setTimeout(() => {
    el.toast.classList.add("hide");
    el.toast.classList.remove("show");
    setTimeout(nextAction, 350);
  }, 14000);
}

function endGame() {
  stopQTimer();
  const best = Number(localStorage.getItem(BEST_KEY)||"0");
  if (score > best) localStorage.setItem(BEST_KEY, String(score));
  addToLB(score);

  const T = tr();
  const { lv, emoji, title } = getRankInfo(score);
  el.finalScore.textContent = score;
  el.finalRank.textContent  = `${emoji} ${title}`;
  el.bestInModal.textContent = Math.max(score, best);
  el.modalSubtitle.textContent = T.levelSub(lv);
  el.lYourScore.innerHTML = `${T.yourScore} <span id="bestInModal">${Math.max(score,best)}</span>`;

  renderLB(score);
  el.modal.classList.add("show");

  // Show PWA install banner 800ms after game over, auto-dismiss in 5s
  setTimeout(() => showPwaBanner(5000), 800);
}

function restart() {
  stopQTimer();
  lives=3; maxLives=3; score=0; combo=0; streak=0; wrongCount=0; qIndex=0;
  seenIdxs.clear(); // fresh session: all questions available again
  el.modal.classList.remove("show");
  deck = buildDeck();
  pickNext();
  render();
}

async function init() {
  stopQTimer();
  bank=[]; deck=[]; current=null; qIndex=0;
  lives=3; maxLives=3; score=0; combo=0; streak=0; wrongCount=0;
  seenIdxs.clear(); // reset seen questions on new game
  el.modal.classList.remove("show");
  applyTranslations();

  const url = Q_URLS[lang] || Q_URLS.en;
  try {
    const res = await fetch(url, { cache:"no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.json();
    if (!Array.isArray(raw)) throw new Error("must be an array");
    bank = raw.map((q, idx) => normalizeQuestion(q, idx));
    deck = buildDeck();
    pickNext();
    const firstLaunch = !sessionStorage.getItem('wigg_started');
    if (firstLaunch) {
      sessionStorage.setItem('wigg_started', '1');
      showStartScreen();
    } else {
      render();
    }
  } catch(err) {
    el.question.textContent = `Failed to load: ${url}`;
    el.status.className = "status wrong";
    el.status.textContent = "Error";
    el.hint.textContent = String(err?.message||err);
  }
}

el.restart.addEventListener("click", restart);
el.playAgain.addEventListener("click", restart);
el.shareBtn.addEventListener("click", shareScore);

/* ══ PWA INSTALL ══ */
let _deferredInstallPrompt = null;

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  _deferredInstallPrompt = e;
});

function showPwaBanner(autoHideMs) {
  if (!_deferredInstallPrompt) return; // not installable (already installed or not supported)
  el.pwaBanner.classList.add("show");
  // Animate progress bar countdown
  requestAnimationFrame(() => {
    el.pwaBannerProgressFill.classList.remove("running");
    void el.pwaBannerProgressFill.offsetWidth; // force reflow
    el.pwaBannerProgressFill.classList.add("running");
  });
  if (autoHideMs > 0) {
    setTimeout(hidePwaBanner, autoHideMs);
  }
}

function hidePwaBanner() {
  el.pwaBanner.classList.remove("show");
}

el.pwaInstallBtn.addEventListener("click", async () => {
  if (!_deferredInstallPrompt) return;
  hidePwaBanner();
  _deferredInstallPrompt.prompt();
  const { outcome } = await _deferredInstallPrompt.userChoice;
  if (outcome === "accepted") _deferredInstallPrompt = null;
});

el.pwaBannerClose.addEventListener("click", hidePwaBanner);

// Also: if someone clicks the banner title/sub area → trigger install
el.pwaBannerTitle && el.pwaBannerTitle.closest && (function(){
  // handled by button click above
})();

init();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(console.error);
    });
  }
</script>
