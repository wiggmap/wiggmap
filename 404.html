<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1a5430;--ink:#171714;--ink-soft:#54554e;--bg:#f5f0e8;--paper:#fffdf8;--border:#c8bfaa;--muted:#8a7f6a}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);min-height:100svh;min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px 60px;text-align:center}
.huge{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(96px,18vw,200px);line-height:1;color:var(--green);letter-spacing:-.04em;margin-bottom:8px;text-shadow:0 4px 30px rgba(26,84,48,.15)}
h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(28px,4vw,42px);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-bottom:14px;max-width:18ch}
.sub{font-size:clamp(14px,1.6vw,17px);color:var(--ink-soft);max-width:54ch;line-height:1.65;margin-bottom:36px}
.search-block{width:100%;max-width:520px;margin-bottom:40px;position:relative}
.search-form{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--border);border-radius:100px;padding:6px 6px 6px 22px;box-shadow:0 8px 30px rgba(26,84,48,.08)}
.search-form svg{width:17px;height:17px;color:var(--muted);flex-shrink:0}
.search-input{flex:1;border:none;outline:none;background:transparent;font-family:'Inter',sans-serif;font-size:15px;padding:13px 0;color:var(--ink);min-width:0}
.search-input::placeholder{color:var(--muted)}
.search-go{background:var(--green);color:#fff;border:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;padding:11px 22px;border-radius:100px;cursor:pointer;transition:background .15s,transform .15s;white-space:nowrap}
.search-go:hover{background:#145228;transform:translateY(-1px)}
.search-sug{position:absolute;top:calc(100% + 10px);left:0;right:0;background:var(--paper);border:1px solid var(--border);border-radius:14px;max-height:280px;overflow-y:auto;display:none;z-index:50;box-shadow:0 12px 40px rgba(0,0,0,.12);text-align:left}
.ssi{padding:11px 18px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(200,191,170,.4)}
.ssi:last-child{border-bottom:none}
.ssi:hover,.ssi.active{background:#f0ede4}
.quick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
.quick a{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border:1.5px solid var(--green);border-radius:2px;font-size:13px;font-weight:600;color:var(--green);text-decoration:none;background:transparent;transition:background .15s,color .15s}
.quick a:hover{background:var(--green);color:#fff}
@media(max-width:600px){main{padding:50px 16px 40px}.search-form{padding:5px 5px 5px 18px}.search-input{font-size:14px;padding:11px 0}.search-go{font-size:12px;padding:9px 16px}}
</style>
</head>

<main>
  <div class="huge" id="huge">404</div>
  <h1 id="title">This page wandered off the map.</h1>
  <p class="sub" id="sub">The page you are looking for does not exist or has been moved. Try searching for a country, or jump back to one of our most popular sections.</p>

  <div class="search-block">
    <form class="search-form" id="searchForm" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" class="search-input" type="text" placeholder="Search a country…">
      <button class="search-go" type="submit" id="searchGo">Go →</button>
    </form>
    <div id="searchSug" class="search-sug"></div>

  <div class="quick">
    <a href="/" id="qHome">🏠 Home</a>
    <a href="/globe.html" id="qGlobe">🌍 3D Globe</a>
    <a href="/indexchronicles.html" id="qChron">📖 Chronicles</a>
    <a href="/wiggmatch.html" id="qMatch">💚 WiggMatch</a>
  </div>
</main>

<div id="siteFooter"></div>
<script src="/data/footer.js"></script>

<script>
(function(){
  var T = {
    en:{title:"This page wandered off the map.",sub:"The page you are looking for does not exist or has been moved. Try searching for a country, or jump back to one of our most popular sections.",placeholder:"Search a country…",go:"Go →",home:"🏠 Home",globe:"🌍 3D Globe",chron:"📖 Chronicles",match:"💚 WiggMatch",pageTitle:"404 — Page not found · WiggMap"},
    fr:{title:"Cette page s'est perdue en route.",sub:"La page que vous cherchez n'existe pas ou a été déplacée. Cherchez un pays ou revenez à l'une de nos sections principales.",placeholder:"Chercher un pays…",go:"Go →",home:"🏠 Accueil",globe:"🌍 Globe 3D",chron:"📖 Chroniques",match:"💚 WiggMatch",pageTitle:"404 — Page introuvable · WiggMap"},
    es:{title:"Esta página se perdió en el mapa.",sub:"La página que buscas no existe o ha sido movida. Busca un país o vuelve a una de nuestras secciones principales.",placeholder:"Buscar un país…",go:"Ir →",home:"🏠 Inicio",globe:"🌍 Globo 3D",chron:"📖 Crónicas",match:"💚 WiggMatch",pageTitle:"404 — Página no encontrada · WiggMap"}
  };
  var L = (localStorage.getItem('wigg_lang')||'en').toLowerCase();
  if (['en','fr','es'].indexOf(L) === -1) L = 'en';
  var t = T[L];
  document.title = t.pageTitle;
  document.documentElement.lang = L;
  document.getElementById('title').textContent = t.title;
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('searchInput').placeholder = t.placeholder;
  document.getElementById('searchGo').textContent = t.go;
  document.getElementById('qHome').textContent = t.home;
  document.getElementById('qGlobe').textContent = t.globe;
  document.getElementById('qChron').textContent = t.chron;
  document.getElementById('qMatch').textContent = t.match;

  // Search
  var url = L === 'fr' ? '/data/countries.fr.json' : L === 'es' ? '/data/countries.es.json' : '/data/countries.json';
  var CDATA = null;
  function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
  fetch(url).then(r=>r.ok?r.json():null).then(d=>CDATA=d).catch(()=>{});

  var inp = document.getElementById('searchInput');
  var sug = document.getElementById('searchSug');
  var form = document.getElementById('searchForm');
  var matches = [];

  function search(q){
    if (!CDATA || !q) return [];
    var out = [];
    var keys = Object.keys(CDATA);
    for (var i = 0; i < keys.length && out.length < 8; i++) {
      var k = keys[i], c = CDATA[k];
      if (norm(c.name||k).indexOf(q) === 0) out.push({slug:k,name:c.name||k,flag:c.flag||'🌐'});
    }
    for (var i2 = 0; i2 < keys.length && out.length < 8; i2++) {
      var k2 = keys[i2], c2 = CDATA[k2];
      if (norm(c2.name||k2).indexOf(q) > 0 && !out.find(x=>x.slug===k2)) out.push({slug:k2,name:c2.name||k2,flag:c2.flag||'🌐'});
    }
    return out;
  }

  inp.addEventListener('input', function(){
    matches = search(norm(inp.value));
    if (!matches.length) { sug.style.display='none'; return; }
    sug.innerHTML = matches.map(m => '<div class="ssi" data-s="'+m.slug+'"><span style="font-size:18px">'+m.flag+'</span><span>'+m.name+'</span></div>').join('');
    sug.style.display = 'block';
  });
  sug.addEventListener('click', function(e){
    var it = e.target.closest('[data-s]');
    if (it) window.location.href = '/countries/country.html?country=' + it.dataset.s;
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (matches.length) window.location.href = '/countries/country.html?country=' + matches[0].slug;
  });
  document.addEventListener('click', function(e){
    if (!e.target.closest('.search-block')) sug.style.display = 'none';
  });
})();
</script>
</body>
