  <style>
    :root{
      --bg:#f6f1e8;
      --bg-soft:#fbf8f2;
      --paper:#fffdf8;
      --paper-2:#f8f2e9;
      --ink:#171714;
      --ink-soft:#54554e;
      --line:rgba(23,23,20,.10);
      --green:#1d7f48;
      --green-soft:rgba(29,127,72,.10);
      --shadow-1:0 12px 34px rgba(25,20,12,.06);
      --shadow-2:0 24px 70px rgba(25,20,12,.10);

      --theme-visa:#178a5b;
      --theme-nomad:#0f82a2;
      --theme-future:#7d55d8;
      --theme-family:#d7731d;
      --theme-dest:#c0792e;
      --theme-city:#6b7280;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    *::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      font-family:"Inter",system-ui,sans-serif;
      color:var(--ink);
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.9), transparent 28%),
        radial-gradient(circle at top right, rgba(29,127,72,.045), transparent 22%),
        linear-gradient(180deg, #f9f5ed 0%, #f3ede3 100%);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    a{text-decoration:none;color:inherit}

    .cw{
      width:min(1280px, calc(100% - 40px));
      margin:0 auto;
      padding:28px 0 88px;
    }

    @media (max-width:700px){
      .cw{
        width:min(100% - 24px, 1280px);
        padding:14px 0 54px;
      }
    }

    /* ===== MASTHEAD ===== */
    .masthead{
      position:relative;
      margin:14px 0 28px;
      border:1px solid rgba(23,23,20,.07);
      background:
        linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.72)),
        linear-gradient(135deg, rgba(29,127,72,.03), transparent 34%);
      box-shadow:var(--shadow-1);
      border-radius:30px;
      overflow:hidden;
    }

    .masthead::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 88% 18%, rgba(29,127,72,.05), transparent 18%),
        radial-gradient(circle at 8% 92%, rgba(0,0,0,.025), transparent 24%);
      pointer-events:none;
    }

    .masthead-inner{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:minmax(0, 1.05fr) minmax(320px, 470px);
      gap:26px;
      align-items:stretch;
      padding:24px;
    }

    .masthead-copy{
      min-width:0;
      padding:18px 14px 14px 14px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .masthead-label{
      display:inline-flex;
      align-items:center;
      gap:12px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.24em;
      text-transform:uppercase;
      color:var(--green);
      margin-bottom:16px;
    }

    .masthead-label::before{
      content:"";
      width:28px;
      height:1px;
      background:rgba(29,127,72,.55);
      display:block;
    }

    .masthead h1{
      font-family:"Playfair Display", Georgia, serif;
      font-size:clamp(42px, 6vw, 82px);
      line-height:.92;
      letter-spacing:-.04em;
      font-weight:700;
      max-width:8.5ch;
      margin-bottom:16px;
    }

    .masthead h1 em{
      color:var(--green);
      font-style:italic;
      font-weight:700;
    }

    .masthead-sub{
      max-width:58ch;
      font-size:15px;
      line-height:1.85;
      color:var(--ink-soft);
      margin-bottom:24px;
    }

    .masthead-media{
      min-width:0;
      display:flex;
      align-items:stretch;
    }

    .masthead-art{
      position:relative;
      width:100%;
      min-height:320px;
      border-radius:24px;
      overflow:hidden;
      border:1px solid rgba(23,23,20,.06);
      box-shadow:
        0 14px 34px rgba(23,23,20,.06),
        inset 0 1px 0 rgba(255,255,255,.55);
      background:#efe7da;
    }

    .masthead-art::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), transparent 30%),
        linear-gradient(0deg, rgba(255,250,244,.10), rgba(255,250,244,.10));
      pointer-events:none;
    }

    .masthead-art img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
    }

    .masthead-rule{
      display:flex;
      align-items:center;
      gap:14px;
      padding:0 28px 22px;
    }

    .masthead-rule::before,
    .masthead-rule::after{
      content:"";
      flex:1;
      height:1px;
      background:var(--line);
    }

    .masthead-rule-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--green);
      box-shadow:0 0 0 6px rgba(29,127,72,.08);
      flex:0 0 auto;
    }

    @media (max-width:980px){
      .masthead-inner{
        grid-template-columns:1fr;
        gap:16px;
      }
      .masthead-copy{padding:6px 4px 0}
      .masthead-art{min-height:230px}
    }

    @media (max-width:640px){
      .masthead{border-radius:24px}
      .masthead-inner{padding:16px}
      .masthead h1{font-size:clamp(34px, 12vw, 56px);max-width:9ch}
      .masthead-sub{font-size:14px;line-height:1.7}
      .masthead-art{min-height:190px;border-radius:18px}
      .masthead-rule{padding:0 16px 16px}
    }

    /* ===== THEMATIC SECTIONS ===== */
    .theme-section{
      margin-bottom:42px;
    }

    .theme-head{
      display:flex;
      align-items:center;
      gap:14px;
      margin:0 0 18px;
    }

    .theme-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      flex-shrink:0;
    }

    .theme-label{
      font-size:12px;
      font-weight:800;
      letter-spacing:.20em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .theme-rule{
      height:1px;
      flex:1;
      background:linear-gradient(90deg, rgba(23,23,20,.12), rgba(23,23,20,.04));
    }

    .theme-toggle{
      border:none;
      outline:none;
      cursor:pointer;
      padding:0 14px;
      min-height:32px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      box-shadow:inset 0 0 0 1px rgba(23,23,20,.08), 0 4px 12px rgba(23,23,20,.03);
      font:700 10px/1 "Inter",system-ui,sans-serif;
      letter-spacing:.14em;
      text-transform:uppercase;
      transition:background .15s, color .15s;
      white-space:nowrap;
      flex-shrink:0;
    }

    .theme-toggle:hover{
      background:#fff;
    }

    /* ===== CARD GRID ===== */
    .cw-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:18px;
      align-items:stretch;
    }

    @media (max-width:1040px){.cw-grid{grid-template-columns:1fr 1fr}}
    @media (max-width:640px){.cw-grid{grid-template-columns:1fr}}

    .cw-card{
      position:relative;
      display:flex;
      flex-direction:column;
      min-height:100%;
      border-radius:24px;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,252,247,.92));
      border:1px solid rgba(23,23,20,.08);
      box-shadow:0 10px 28px rgba(23,23,20,.05);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .cw-card:hover{
      transform:translateY(-3px);
      border-color:rgba(23,23,20,.14);
      box-shadow:0 22px 46px rgba(23,23,20,.10);
    }

    .cw-card::before{
      content:"";
      position:absolute;
      top:0;left:0;right:0;
      height:3px;
      background:var(--card-accent, rgba(23,23,20,.1));
    }

    .card-head{padding:16px 18px 10px}

    .card-theme{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:14px;
      font-size:10px;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--card-accent, rgba(23,23,20,.54));
    }

    .card-theme-dot{
      width:6px;
      height:6px;
      border-radius:50%;
      background:currentColor;
      flex-shrink:0;
    }

    .cw-card h3{
      font-family:"Fraunces", Georgia, serif;
      font-size:18px;
      line-height:1.22;
      letter-spacing:-.01em;
      font-weight:700;
      color:var(--ink);
    }

    .card-body{
      flex:1;
      padding:0 18px 12px;
    }

    .card-excerpt{
      color:var(--ink-soft);
      font-size:13px;
      line-height:1.72;
      display:-webkit-box;
      -webkit-line-clamp:3;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .card-footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 18px 14px;
      border-top:1px solid rgba(23,23,20,.08);
    }

    .card-meta{
      font-size:10px;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(23,23,20,.40);
    }

    .card-read{
      color:var(--card-accent, var(--green));
      font-size:11px;
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
      transition:letter-spacing .16s ease;
      flex-shrink:0;
    }

    .cw-card:hover .card-read{letter-spacing:.20em}

    .t-visa   { --card-accent: var(--theme-visa); }
    .t-nomad  { --card-accent: var(--theme-nomad); }
    .t-future { --card-accent: var(--theme-future); }
    .t-family { --card-accent: var(--theme-family); }
    .t-dest   { --card-accent: var(--theme-dest); }
    .t-city   { --card-accent: var(--theme-city); }

    /* ===== COMING SOON ===== */
    .coming-soon{
      text-align:center;
      padding:40px 20px;
      border-radius:24px;
      border:1px dashed rgba(23,23,20,.16);
      color:rgba(23,23,20,.44);
      background:rgba(255,255,255,.56);
      font-weight:700;
      font-size:13px;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px)}
      to{opacity:1;transform:translateY(0)}
    }

    .masthead{animation:fadeUp .55s ease both}
    .theme-section{animation:fadeUp .55s .12s ease both}
  </style>
</head>

    /* -------------------------------------------------------
       Sections definition (order matters)
       ------------------------------------------------------- */
    var SECTIONS = [
      { id: "visas",  i18nKey: "sec_visas",  color: "var(--theme-visa)",   cls: "t-visa" },
      { id: "dest",   i18nKey: "sec_dest",   color: "var(--theme-dest)",   cls: "t-dest" },
      { id: "nomads", i18nKey: "sec_nomads",  color: "var(--theme-nomad)",  cls: "t-nomad" },
      { id: "family", i18nKey: "sec_family",  color: "var(--theme-family)", cls: "t-family" },
      { id: "future", i18nKey: "sec_future",  color: "var(--theme-future)", cls: "t-future" },
      { id: "city",   i18nKey: "sec_city",    color: "var(--theme-city)",   cls: "t-city" }
    ];

    var MAX_VISIBLE = 3;

    /* -------------------------------------------------------
       Helpers
       ------------------------------------------------------- */
    function getLang() {
      return (localStorage.getItem("wigg_lang") || "en").toLowerCase();
    }

    function str(obj) {
      if (!obj) return "";
      if (typeof obj === "string") return obj;
      var l = getLang();
      return obj[l] || obj.en || "";
    }

    function tx() {
      var l = getLang();
      return I18N[l] || I18N.en;
    }

    function fmtDate(iso) {
      if (!iso) return "";
      var parts = iso.split("-").map(Number);
      var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
      var l = getLang();
      var locale = l === "fr" ? "fr-FR" : l === "es" ? "es-ES" : "en-GB";
      return dt.toLocaleDateString(locale, { year: "numeric", month: "short", day: "numeric" });
    }

    /* -------------------------------------------------------
       Build one card HTML
       ------------------------------------------------------- */
    function cardHTML(c, cls) {
      var t = tx();
      var url = str(c.url);
      var date = c.date ? fmtDate(c.date) : "";
      return '<article class="cw-card ' + cls + '">' +
        '<div class="card-head">' +
          '<div class="card-theme"><span class="card-theme-dot"></span>' + (c.theme || "") + '</div>' +
          '<h3>' + str(c.title) + '</h3>' +
        '</div>' +
        '<div class="card-body"><p class="card-excerpt">' + str(c.excerpt) + '</p></div>' +
        '<div class="card-footer">' +
          '<span class="card-meta">' + date + (c.read ? " · " + c.read : "") + '</span>' +
          '<a class="card-read" href="' + url + '">' + t.read + '</a>' +
        '</div>' +
      '</article>';
    }

    /* -------------------------------------------------------
       Build one thematic section
       ------------------------------------------------------- */
    function buildSection(secDef, articles) {
      var t = tx();
      var label = t[secDef.i18nKey] || secDef.id;
      var hasMore = articles.length > MAX_VISIBLE;
      var sectionId = "sec-" + secDef.id;
      var gridId = "grid-" + secDef.id;
      var btnId = "btn-" + secDef.id;

      // Sort by date descending (most recent first)
      articles.sort(function(a, b) { return (b.date || "").localeCompare(a.date || ""); });

      var html = '<div class="theme-section" id="' + sectionId + '">';

      // Section header
      html += '<div class="theme-head">' +
        '<span class="theme-dot" style="background:' + secDef.color + '"></span>' +
        '<span class="theme-label" style="color:' + secDef.color + '">' + label + '</span>' +
        '<div class="theme-rule"></div>';
      if (hasMore) {
        html += '<button class="theme-toggle" id="' + btnId + '" ' +
          'style="color:' + secDef.color + '" ' +
          'onclick="toggleSection(\'' + secDef.id + '\')">' + t.seeAll + '</button>';
      }
      html += '</div>';

      // Cards grid
      html += '<div class="cw-grid" id="' + gridId + '">';
      articles.forEach(function(c, i) {
        var hidden = (i >= MAX_VISIBLE) ? ' style="display:none" data-extra="1"' : '';
        html += '<div' + hidden + '>' + cardHTML(c, secDef.cls) + '</div>';
      });
      html += '</div>';

      html += '</div>';
      return html;
    }

    /* -------------------------------------------------------
       Build empty section (Comparatifs Villes)
       ------------------------------------------------------- */
    function buildEmptySection(secDef) {
      var t = tx();
      var label = t[secDef.i18nKey] || secDef.id;

      return '<div class="theme-section">' +
        '<div class="theme-head">' +
          '<span class="theme-dot" style="background:' + secDef.color + '"></span>' +
          '<span class="theme-label" style="color:' + secDef.color + '">' + label + '</span>' +
          '<div class="theme-rule"></div>' +
        '</div>' +
        '<div class="coming-soon">' + t.comingSoon + '</div>' +
      '</div>';
    }

    /* -------------------------------------------------------
       Toggle expand/collapse a section
       ------------------------------------------------------- */
    window.toggleSection = function(secId) {
      var t = tx();
      var grid = document.getElementById("grid-" + secId);
      var btn = document.getElementById("btn-" + secId);
      if (!grid || !btn) return;

      var extras = grid.querySelectorAll("[data-extra]");
      var isExpanded = btn.getAttribute("data-expanded") === "1";

      if (isExpanded) {
        extras.forEach(function(el) { el.style.display = "none"; });
        btn.textContent = t.seeAll;
        btn.removeAttribute("data-expanded");
      } else {
        extras.forEach(function(el) { el.style.display = ""; });
        btn.textContent = t.collapse;
        btn.setAttribute("data-expanded", "1");
      }
    };

    /* -------------------------------------------------------
       Render everything
       ------------------------------------------------------- */
    function render() {
      var root = document.getElementById("sectionsRoot");
      var allHTML = "";

      SECTIONS.forEach(function(secDef) {
        var articles = ARTICLES.filter(function(a) { return a.section === secDef.id; });
        if (articles.length === 0) {
          allHTML += buildEmptySection(secDef);
        } else {
          allHTML += buildSection(secDef, articles);
        }
      });

      root.innerHTML = allHTML;
    }

    function applyI18n() {
      var t = tx();
      var l = getLang();
      document.documentElement.lang = l;
      document.getElementById("eyebrow").textContent = t.eyebrow;
      document.getElementById("heroTitle").innerHTML = "Wigg <em>" + t.titleWord + "</em>";
      document.getElementById("heroSub").textContent = t.sub;
    }

    function init() {
      applyI18n();
      render();
    }

    init();

    window.addEventListener("wigg_lang_changed", function() {
      applyI18n();
      render();
    });
  </script>
