  {id:"city-au",label:{en:"🇦🇺 City Guides · Australia",fr:"🇦🇺 Guides Villes · Australie",es:"🇦🇺 Guías Ciudad · Australia"}},
  {id:"city-ca",label:{en:"🇨🇦 City Guides · Canada",fr:"🇨🇦 Guides Villes · Canada",es:"🇨🇦 Guías Ciudad · Canadá"}},
  {id:"visa",label:{en:"🛂 Visas & Immigration",fr:"🛂 Visas & immigration",es:"🛂 Visas e Inmigración"}},
  {id:"dest",label:{en:"🌍 Expat Destinations",fr:"🌍 Destinations expat",es:"🌍 Destinos Expat"}},
  {id:"nomad",label:{en:"💻 Digital Nomadism",fr:"💻 Nomadisme digital",es:"💻 Nomadismo Digital"}},

];

var I18N = {
  en:{kicker:"Chronicles · Insight & Analysis",h1:"All Chronicles",count:" articles · 2026"},
  fr:{kicker:"Chronicles · Insight & Analysis",h1:"Toutes les chronicles",count:" articles · 2026"},
  es:{kicker:"Chronicles · Insight & Analysis",h1:"Todas las crónicas",count:" artículos · 2026"}
};

/* ═══════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════ */
function getLang(){return(localStorage.getItem("wigg_lang")||"en").toLowerCase()}
function str(o){if(!o)return"";if(typeof o==="string")return o;var l=getLang();return o[l]||o.en||""}

function cardHTML(a){
  var url=str(a.url);
  var hasImg=a.img&&!a.emoji;
  var html='<a class="card" href="'+url+'">';
  if(hasImg){
    html+='<img class="card-img" src="'+a.img+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">';
    html+='<div class="card-emoji" style="display:none">'+(a.emoji||a.flag||"📄")+'</div>';
  } else if(a.emoji){
    html+='<div class="card-emoji">'+a.emoji+'</div>';
  } else {
    html+='<div class="card-emoji">'+(a.flag||"📄")+'</div>';
  }
  html+='<div class="card-grad"></div>';
  html+='<div class="card-body">';
  html+='<div class="card-meta">'+a.flag+' '+str(a.reg)+' · '+a.time+'</div>';
  html+='<div class="card-title">'+str(a.t)+'</div>';
  html+='</div></a>';
  return html;
}

function render(){
  var l=getLang();
  var t=I18N[l]||I18N.en;

  document.getElementById("edKicker").textContent=t.kicker;
  document.getElementById("edH1").textContent=t.h1;
  document.getElementById("edCount").textContent=ARTICLES.length+t.count;
  document.documentElement.lang=l;

  var root=document.getElementById("rowsRoot");
  var html="";

  SECTIONS.forEach(function(sec){
    var items=ARTICLES.filter(function(a){return a.s===sec.id});
    if(!items.length)return;

    html+='<div class="row">';
    html+='<div class="row-head">';
    html+='<div class="row-title">'+str(sec.label)+'</div>';
    html+='</div>';
    html+='<div class="carousel">';
    items.forEach(function(a){html+=cardHTML(a)});
    html+='</div></div>';
  });

  root.innerHTML=html;
}

render();
window.addEventListener("wigg_lang_changed",render);
</script>
