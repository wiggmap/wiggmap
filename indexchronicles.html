var SECTIONS=[
{id:"visas", key:"sec_visas", color:"var(--theme-visa)"},
{id:"dest",  key:"sec_dest",  color:"var(--theme-dest)"},
{id:"nomads",key:"sec_nomads",color:"var(--theme-nomad)"},
{id:"family",key:"sec_family",color:"var(--theme-family)"},
{id:"future",key:"sec_future",color:"var(--theme-future)"},
{id:"city",  key:"sec_city",  color:"var(--theme-city)", page:"/chronicles-villes.html"}
];

var MAX=15;

function getLang(){return(localStorage.getItem("wigg_lang")||"en").toLowerCase()}
function str(o){if(!o)return"";if(typeof o==="string")return o;var l=getLang();return o[l]||o.en||""}
function tx(){var l=getLang();return I18N[l]||I18N.en}
function pickRandom(arr,n){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a.slice(0,n)}

function cardSingle(a){
  var url=str(a.url),hasImg=a.img&&!a.emoji;
  var h='<a class="vcard" href="'+url+'">';
  if(hasImg){h+='<img class="vcard-img" src="'+a.img+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">';h+='<div class="vcard-emoji" style="display:none">'+(a.emoji||a.flag||"?")+'</div>';}
  else if(a.emoji){h+='<div class="vcard-emoji">'+a.emoji+'</div>';}
  else{h+='<div class="vcard-emoji">'+(a.flag||"?")+'</div>';}
  h+='<div class="vcard-grad"></div><div class="vcard-body"><div class="vcard-meta">'+a.flag+' '+str(a.reg)+' - '+a.time+'</div><div class="vcard-title">'+str(a.title)+'</div></div></a>';
  return h;
}

function cardSplit(a){
  var url=str(a.url),countries=a.countries||[];
  var n=countries.length>=4?4:2;
  var picked=pickRandom(countries,n);
  var cls="split-"+(picked.length>=4?"4":"2");
  var h='<a class="vcard" href="'+url+'"><div class="split-grid '+cls+'">';
  picked.forEach(function(slug){
    h+='<div class="split-cell"><img src="/assets/hero-'+slug+'.jpg" alt="'+slug+'" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=split-emoji>'+a.flag+'</div>\'"></div>';
  });
  h+='</div><div class="vcard-grad"></div><div class="vcard-body"><div class="vcard-meta">'+a.flag+' '+str(a.reg)+' - '+a.time+'</div><div class="vcard-title">'+str(a.title)+'</div></div></a>';
  return h;
}

function cardHTML(a){if(a.countries&&a.countries.length>=2&&!a.img)return cardSplit(a);return cardSingle(a);}

function render(){
  var t=tx(),root=document.getElementById("sectionsRoot"),html="";
  SECTIONS.forEach(function(sec){
    var label=t[sec.key]||sec.id,pageUrl=str(sec.page);
    html+='<div class="theme-section"><div class="theme-head"><span class="theme-dot" style="background:'+sec.color+'"></span><span class="theme-label" style="color:'+sec.color+'">'+label+'</span><div class="theme-rule"></div>';
    if(pageUrl)html+='<a class="theme-see" href="'+pageUrl+'">'+t.seeAll+'</a>';
    html+='</div><div class="carousel">';
    var items=ARTICLES.filter(function(a){return a.section===sec.id;});
    items.sort(function(a,b){return(b.date||"").localeCompare(a.date||"");});
    if(!items.length){html+='</div><div class="coming-soon">'+t.comingSoon+'</div></div>';return;}
    items.slice(0,MAX).forEach(function(a){html+=cardHTML(a);});
    html+='</div></div>';
  });
  root.innerHTML=html;
}

function applyI18n(){
  var t=tx(),l=getLang();
  document.documentElement.lang=l;
  document.getElementById("eyebrow").textContent=t.eyebrow;
  document.getElementById("heroTitle").innerHTML="Wigg <em>"+t.titleWord+"</em>";
  document.getElementById("heroSub").textContent=t.sub;
}

function init(){applyI18n();render();}
init();
window.addEventListener("wigg_lang_changed",function(){applyI18n();render();});
  </script>
