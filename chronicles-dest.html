/* ── SECTIONS ── */
.theme-section{margin-bottom:44px}

.grid{display:flex;flex-wrap:wrap;gap:12px;padding-bottom:8px}

/* ── CARDS ── */
.vcard{flex-shrink:0;width:150px;height:115px;border-radius:14px;overflow:hidden;position:relative;border:1px solid rgba(23,23,20,.12);cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s;display:block;background:#e8e0d5;box-shadow:0 4px 14px rgba(23,23,20,.07);}

.vcard:hover{border-color:var(--green);box-shadow:0 8px 28px rgba(23,23,20,.14);transform:translateY(-2px)}
.vcard:hover .vcard-img,.vcard:hover .split-cell img{transform:scale(1.04)}
.vcard-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.vcard-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,15,8,.7) 0%,rgba(20,15,8,.2) 45%,transparent 100%);z-index:1}
.vcard-body{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;z-index:2;background:rgba(12,10,6,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:0 0 13px 13px}

.vcard-meta{font-size:8px;font-weight:700;color:#22a15a;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:768px){.vcard-meta{font-size:9px}}
.vcard-title{font-family:"Fraunces",Georgia,serif;font-size:10px;font-weight:700;color:#fffdf8;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(min-width:768px){.vcard-title{font-size:11px}}
.vcard-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(135deg,#ede5d8,#ddd3c4);z-index:0}
@media(min-width:768px){.vcard-emoji{font-size:44px}}
.split-grid{position:absolute;inset:0;display:grid;gap:1px;background:rgba(23,23,20,.18);z-index:0}
.split-grid.split-2{grid-template-columns:1fr 1fr}
.split-grid.split-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.split-cell{overflow:hidden;position:relative}
.split-cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.split-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(135deg,#ede5d8,#ddd3c4)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.pg-head{animation:fadeUp .55s ease both}

  {title:{en:"Australia 2026: The Complete Expat Guide",fr:"Australie 2026 : le guide complet de l'expatriation",es:"Australia 2026: La guía completa del expatriado"},url:{en:"/chronicles/chronicle-australia-expat-guide-2026-en.html",fr:"/chronicles/chronicle-australie-expatriation-2026-fr.html",es:"/chronicles/chronicle-australia-guia-expatriados-2026-es.html"},img:"/assets/hero-australia.jpg",flag:"🇦🇺",reg:{en:"Oceania",fr:"Océanie",es:"Oceanía"},time:"~25 min",date:"2026-02-20"},

  {title:{en:"The 25 Best Healthcare Systems for Expats in 2026",fr:"Les 25 meilleurs systèmes de santé pour les expatriés en 2026",es:"Los 25 mejores sistemas sanitarios para expatriados en 2026"},url:{en:"/chronicles/chronicle-healthcare-expats-2026-en.html",fr:"/chronicles/chronicle-sante-expats-2026-fr.html",es:"/chronicles/chronicle-salud-expats-2026-es.html"},countries:["taiwan","south-korea","japan","germany"],flag:"🌍",reg:{en:"Global",fr:"Global",es:"Global"},time:"~35 min",date:"2026-03-15"},

  {title:{en:"Am I Really Ready to Move Abroad?",fr:"Suis-je vraiment prêt à partir à l'étranger ?",es:"¿Estoy realmente listo para irme al extranjero?"},url:{en:"/chronicles/chronicle-ready-to-leave-en.html",fr:"/chronicles/chronicle-pret-partir-fr.html",es:"/chronicles/chronicle-listo-para-partir-es.html"},emoji:"🧭",flag:"🧭",reg:{en:"Global",fr:"Global",es:"Global"},time:"~20 min",date:"2026-04-03"}
];

function getLang(){return(localStorage.getItem("wigg_lang")||"en").toLowerCase()}
function str(o){if(!o)return"";if(typeof o==="string")return o;var l=getLang();return o[l]||o.en||""}
function pickRandom(arr,n){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a.slice(0,n)}

function cardSingle(a){
  var url=str(a.url),hasImg=a.img&&!a.emoji;
  var h='<a class="vcard" href="'+url+'">';
  if(hasImg){h+='<img class="vcard-img" src="'+a.img+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">';h+='<div class="vcard-emoji" style="display:none">'+(a.emoji||a.flag||"?")+'</div>';}
  else if(a.emoji){h+='<div class="vcard-emoji">'+a.emoji+'</div>';}
  else{h+='<div class="vcard-emoji">'+(a.flag||"?")+'</div>';}
  h+='<div class="vcard-grad"></div><div class="vcard-body"><div class="vcard-meta">'+a.flag+' '+str(a.reg)+' - '+a.time+'</div><div class="vcard-title">'+str(a.title)+'</div></div></a>';
  return h;
}

function cardSplit(a){
  var url=str(a.url),countries=a.countries||[];
  var n=countries.length>=4?4:2;
  var picked=pickRandom(countries,n);
  var cls="split-"+(picked.length>=4?"4":"2");
  var h='<a class="vcard" href="'+url+'"><div class="split-grid '+cls+'">';
  picked.forEach(function(slug){
    h+='<div class="split-cell"><img src="/assets/hero-'+slug+'.jpg" alt="'+slug+'" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=split-emoji>'+a.flag+'</div>\'"></div>';
  });
  h+='</div><div class="vcard-grad"></div><div class="vcard-body"><div class="vcard-meta">'+a.flag+' '+str(a.reg)+' - '+a.time+'</div><div class="vcard-title">'+str(a.title)+'</div></div></a>';
  return h;
}

function cardHTML(a){if(a.countries&&a.countries.length>=2&&!a.img)return cardSplit(a);return cardSingle(a);}

function render(){
  var l=getLang();
  var t=I18N[l]||I18N.fr;

  document.getElementById("backLabel").textContent=t.back;
  document.getElementById("pgTitle").innerHTML=t.title;
  document.getElementById("pgSub").textContent=t.sub;
  document.getElementById("pgCount").textContent=ARTICLES.length+t.count;
  document.documentElement.lang=l;

  var items=ARTICLES.slice().sort(function(a,b){return(a.date||"").localeCompare(b.date||"");});

  var root=document.getElementById("sectionsRoot");
  var html='<div class="theme-section">';
  html+='<div class="theme-head">';
  html+='<span class="theme-dot" style="background:#c0792e"></span>';
  html+='<span class="theme-label" style="color:#c0792e">'+t.label+'</span>';
  html+='<div class="theme-rule"></div>';
  html+='</div>';
  html+='<div class="grid">';
  items.forEach(function(a){html+=cardHTML(a);});
  html+='</div></div>';

  root.innerHTML=html;
}

render();
window.addEventListener("wigg_lang_changed",render);
</script>
