<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forms — WiggMap</title>
<meta name="robots" content="noindex,nofollow">
</head>
<body>
<!--
This page exists ONLY to register form names with Netlify Forms.
Netlify scans HTML at deploy time, so each named form must appear in plain HTML somewhere.
JavaScript-injected forms (like the newsletter signup in footer.js) won't be detected unless
declared here. Do not delete this file unless you also remove all related forms.
-->

<form name="newsletter" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="newsletter">
  <input type="email" name="email">
</form>

<form name="correction" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="correction">
  <input type="text" name="page">
  <input type="text" name="field">
  <textarea name="message"></textarea>
  <input type="email" name="email">
</form>

</body>
</html>
