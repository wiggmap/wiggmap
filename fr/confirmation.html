<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a5430;
  --green-bright:#22c55e;
  --ink:#171714;
  --ink-soft:#54554e;
  --bg:#f5f0e8;
  --paper:#fffdf8;
  --border:#c8bfaa;
  --muted:#8a7f6a;
  --line:rgba(23,23,20,.10);
}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
a{color:inherit;text-decoration:none}

.confirm-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}

.confirm-card{
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:16px;
  max-width:520px;
  width:100%;
  padding:56px 40px;
  text-align:center;
  box-shadow:0 4px 24px rgba(0,0,0,.06);
}

.confirm-emoji{
  font-size:56px;
  line-height:1;
  margin-bottom:20px;
}

.confirm-title{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-style:italic;
  font-weight:700;
  font-size:clamp(28px,5vw,38px);
  line-height:1.15;
  color:var(--ink);
  margin-bottom:12px;
}

.confirm-sub{
  font-size:15px;
  color:var(--ink-soft);
  line-height:1.6;
  margin-bottom:36px;
  max-width:38ch;
  margin-left:auto;
  margin-right:auto;
}

.confirm-actions{
  display:flex;
  flex-direction:column;
  gap:14px;
  align-items:center;
}

.btn-primary{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--green);
  color:#fff;
  font-weight:600;
  font-size:15px;
  padding:14px 32px;
  border-radius:10px;
  transition:background .2s,transform .15s;
  width:100%;
  max-width:340px;
  justify-content:center;
}
.btn-primary:hover{
  background:var(--green-bright);
  color:#fff;
  transform:translateY(-1px);
}

.btn-secondary{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
  padding:10px 20px;
  border-radius:8px;
  border:1px solid var(--line);
  transition:color .2s,border-color .2s;
}
.btn-secondary:hover{
  color:var(--ink);
  border-color:var(--border);
}

@media(max-width:480px){
  .confirm-card{
    padding:40px 24px;
    border-radius:12px;
  }
}
</style>
