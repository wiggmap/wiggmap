/* ── SECTIONS ── */
.theme-section{margin-bottom:44px}
.theme-head{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.theme-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.theme-label{font-size:12px;font-weight:800;letter-spacing:.20em;text-transform:uppercase;white-space:nowrap}
.theme-rule{height:1px;flex:1;background:linear-gradient(90deg,rgba(23,23,20,.12),rgba(23,23,20,.04))}
.carousel{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.carousel::-webkit-scrollbar{display:none}

/* ── CARDS ── */
.vcard{flex-shrink:0;width:150px;height:115px;border-radius:14px;overflow:hidden;position:relative;border:1px solid rgba(23,23,20,.12);cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s;display:block;background:#e8e0d5;box-shadow:0 4px 14px rgba(23,23,20,.07);}
@media(min-width:768px){.vcard{width:190px;height:145px}}
.vcard:hover{border-color:var(--green);box-shadow:0 8px 28px rgba(23,23,20,.14);transform:translateY(-2px)}
.vcard:hover .vcard-img{transform:scale(1.04)}
.vcard-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.vcard-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,15,8,.7) 0%,rgba(20,15,8,.2) 45%,transparent 100%);z-index:1}
.vcard-body{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;z-index:2;background:rgba(12,10,6,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:0 0 13px 13px}
@media(min-width:768px){.vcard-body{padding:10px 12px}}
.vcard-meta{font-size:8px;font-weight:700;color:#22a15a;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:768px){.vcard-meta{font-size:9px}}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

function getLang(){return(localStorage.getItem("wigg_lang")||"en").toLowerCase()}
function str(o){if(!o)return"";if(typeof o==="string")return o;var l=getLang();return o[l]||o.en||""}

function cardHTML(c){
  var url=str(c.url);
  var h='<a class="vcard" href="'+url+'">';
  h+='<img class="vcard-img" src="'+c.img+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">';
  h+='<div class="vcard-emoji" style="display:none">'+c.flag+'</div>';
  h+='<div class="vcard-grad"></div>';
  h+='<div class="vcard-body">';
  h+='<div class="vcard-meta">'+c.flag+' '+str(c.t)+'</div>';
  h+='<div class="vcard-title">'+str(c.t)+' 2026</div>';
  h+='</div></a>';
  return h;
}

function render(){
  var l=getLang();
  var t=I18N[l]||I18N.fr;

  document.getElementById("backLabel").textContent=t.back;
  document.getElementById("pgTitle").innerHTML=t.title+' <em id="pgTitleEm">'+t.titleEm+'</em>';
  document.getElementById("pgSub").textContent=t.sub;
  document.getElementById("pgCount").textContent=CITIES.length+t.count;
  document.documentElement.lang=l;

  var root=document.getElementById("sectionsRoot");
  var html="";

  COUNTRIES.forEach(function(co){
    var cities=CITIES.filter(function(c){return c.country===co.id});
    if(!cities.length)return;

    html+='<div class="theme-section">';
    html+='<div class="theme-head">';
    html+='<span class="theme-dot" style="background:'+co.color+'"></span>';
    html+='<span class="theme-label" style="color:'+co.color+'">'+str(co.label)+'</span>';
    html+='<div class="theme-rule"></div>';
    html+='</div>';
    html+='<div class="carousel">';
    cities.forEach(function(c){html+=cardHTML(c)});
    html+='</div></div>';
  });

  root.innerHTML=html;
}

render();
window.addEventListener("wigg_lang_changed",render);
