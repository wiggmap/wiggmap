<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../assets/favicon.ico" />
  <meta name="theme-color" content="#22c55e" />
  <meta name="robots" content="noindex" />
  <title>Mon profil · WiggMap Connect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/connect.css" />

  <style>
    /* ============================================================
       Profile-specific styles
       ============================================================ */

    /* Cover */
    .prof-cover {
      width: 100%;
      height: 160px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .prof-cover__img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .prof-cover__overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(10,15,30,0.85) 100%);
    }

    /* Edit button overlay on cover */
    .prof-cover__edit {
      position: absolute; top: 10px; right: 12px;
      background: rgba(10,15,30,0.7); border: 0.5px solid #1e2a3a;
      border-radius: 20px; padding: 5px 12px;
      font-size: 11px; color: var(--wigg-text-3);
      text-decoration: none; cursor: pointer;
    }

    /* Avatar block */
    .prof-avatar-row {
      display: flex;
      align-items: flex-end;
      padding: 0 16px;
      margin-top: -36px;
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
    }
    .prof-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 3px solid #0a0f1e;
      background: var(--wigg-green-bg);
      color: var(--wigg-green);
      font-size: 26px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      flex-shrink: 0;
    }
    .prof-avatar img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .prof-avatar__dot {
      position: absolute;
      bottom: 3px; right: 3px;
      width: 12px; height: 12px;
      background: var(--wigg-green);
      border: 2px solid #0a0f1e;
      border-radius: 50%;
    }

    /* Identity block */
    .prof-identity {
      padding: 0 16px 12px;
    }
    .prof-traj {
      font-family: 'Poppins', sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--wigg-text-1);
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .prof-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--wigg-text-1);
      margin-bottom: 2px;
    }
    .prof-meta {
      font-size: 12px;
      color: var(--wigg-text-3);
      margin-bottom: 8px;
    }
    .prof-bio {
      font-size: 13px;
      line-height: 1.6;
      color: var(--wigg-text-2);
      margin-bottom: 10px;
    }

    /* Tags spécialités */
    .prof-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .prof-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--wigg-green);
      background: var(--wigg-green-bg);
      border: 0.5px solid rgba(34,197,94,0.2);
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* Action buttons */
    .prof-actions {
      display: flex;
      gap: 8px;
      padding: 0 16px 16px;
    }
    .prof-btn {
      flex: 1;
      height: 38px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: opacity 0.15s;
    }
    .prof-btn:active { opacity: 0.7; }
    .prof-btn--primary {
      background: var(--wigg-green);
      color: #0a0f1e;
    }
    .prof-btn--ghost {
      background: none;
      border: 0.5px solid #1e2a3a;
      color: var(--wigg-text-2);
    }
    .prof-btn--compat {
      background: none;
      border: 0.5px solid rgba(34,197,94,0.3);
      color: var(--wigg-green);
    }

    /* Stats row */
    .prof-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 0.5px solid #1e2a3a;
      border-bottom: 0.5px solid #1e2a3a;
      margin-bottom: 0;
    }
    .prof-stat {
      padding: 12px 4px;
      text-align: center;
      border-right: 0.5px solid #1e2a3a;
    }
    .prof-stat:last-child { border-right: none; }
    .prof-stat__val {
      font-size: 17px;
      font-weight: 700;
      color: var(--wigg-text-1);
      line-height: 1;
      margin-bottom: 3px;
    }
    .prof-stat__lbl {
      font-size: 9px;
      color: var(--wigg-text-4);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    /* Tabs */
    .prof-tabs {
      display: flex;
      border-bottom: 0.5px solid #1e2a3a;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .prof-tabs::-webkit-scrollbar { display: none; }
    .prof-tab {
      flex: 1;
      min-width: 0;
      padding: 12px 8px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--wigg-text-3);
      text-align: center;
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .prof-tab.active {
      color: var(--wigg-green);
      border-bottom-color: var(--wigg-green);
    }

    /* Tab panels */
    .prof-panel { display: none; padding: 16px; }
    .prof-panel.active { display: block; }

    /* Journal series card */
    .journal-series {
      background: var(--wigg-card);
      border: 0.5px solid #1e2a3a;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .journal-series__header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .journal-series__flag {
      font-size: 28px;
      flex-shrink: 0;
    }
    .journal-series__meta {
      flex: 1;
      min-width: 0;
    }
    .journal-series__title {
      font-size: 14px;
      font-weight: 700;
      color: var(--wigg-text-1);
      margin-bottom: 3px;
    }
    .journal-series__sub {
      font-size: 11px;
      color: var(--wigg-text-3);
    }
    .journal-progress-track {
      height: 4px;
      background: var(--wigg-surface);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .journal-progress-fill {
      height: 100%;
      background: var(--wigg-green);
      border-radius: 2px;
      transition: width 0.3s;
    }
    .journal-series__episodes {
      font-size: 10px;
      color: var(--wigg-text-4);
      text-align: right;
    }
    .journal-entry-preview {
      background: var(--wigg-card);
      border: 0.5px solid #1e2a3a;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .journal-entry-preview__date {
      font-size: 10px;
      color: var(--wigg-text-4);
      margin-bottom: 4px;
    }
    .journal-entry-preview__text {
      font-size: 13px;
      color: var(--wigg-text-2);
      line-height: 1.5;
    }

    /* Reels grid */
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }
    .reel-thumb {
      aspect-ratio: 9/16;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .reel-thumb__bg {
      width: 100%; height: 100%;
    }
    .reel-thumb__dur {
      position: absolute;
      bottom: 6px; right: 6px;
      font-size: 10px;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* Posts list */
    .post-item {
      padding: 12px 0;
      border-bottom: 0.5px solid #1e2a3a;
    }
    .post-item:last-child { border-bottom: none; }
    .post-item__date {
      font-size: 10px;
      color: var(--wigg-text-4);
      margin-bottom: 4px;
    }
    .post-item__text {
      font-size: 13px;
      color: var(--wigg-text-2);
      line-height: 1.5;
    }
    .post-item__actions {
      display: flex;
      gap: 14px;
      margin-top: 8px;
    }
    .post-item__action {
      font-size: 11px;
      color: var(--wigg-text-4);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .post-item__action.helped {
      color: var(--wigg-green);
    }

    /* Infos tab */
    .info-block {
      margin-bottom: 20px;
    }
    .info-block__title {
      font-size: 11px;
      font-weight: 600;
      color: var(--wigg-text-4);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 0.5px solid #1e2a3a;
      font-size: 13px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row__icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .info-row__label { color: var(--wigg-text-3); flex: 0 0 90px; }
    .info-row__val { color: var(--wigg-text-1); flex: 1; }

    /* Lang row */
    .lang-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 0.5px solid #1e2a3a;
      font-size: 13px;
    }
    .lang-row:last-child { border-bottom: none; }
    .lang-dot-row {
      display: flex; gap: 3px; margin-left: auto;
    }
    .lang-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #1e2a3a;
    }
    .lang-dot.on { background: var(--wigg-green); }

    /* Empty state */
    .prof-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--wigg-text-4);
      font-size: 12px;
    }
    .prof-empty__icon { font-size: 32px; margin-bottom: 10px; }

    /* No profile */
    .no-profile {
      text-align: center;
      padding: 60px 24px;
    }
    .no-profile__icon { font-size: 48px; margin-bottom: 16px; }
    .no-profile__title { font-size: 18px; font-weight: 600; color: var(--wigg-text-1); margin-bottom: 8px; }
    .no-profile__sub { font-size: 13px; color: var(--wigg-text-2); margin-bottom: 28px; line-height: 1.6; }

    /* Separator */
    .prof-sep {
      height: 8px;
      background: var(--wigg-surface);
    }

    /* Aidé button */
    .helped-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--wigg-green);
      background: var(--wigg-green-bg);
      border: none;
      border-radius: 20px;
      padding: 4px 10px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .helped-btn:active { opacity: 0.7; }
  </style>
</head>

<script src="assets/connect.js"></script>
<script>
'use strict';
/* ============================================================
   Profile page — rendered from localStorage wigg_profile
   ============================================================ */
(function () {

  var WC      = window.WiggConnect;
  var profile = WC.getProfile();
  var root    = document.getElementById('profileRoot');

  /* -------------------------------------------------------
     Security helper
     ------------------------------------------------------- */
  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* -------------------------------------------------------
     No profile → redirect
     ------------------------------------------------------- */
  if (!profile || !profile.display_name) {
    root.innerHTML =
      '<div class="no-profile">' +
        '<div class="no-profile__icon">🌐</div>' +
        '<div class="no-profile__title">Pas encore de profil</div>' +
        '<p class="no-profile__sub">Crée ton profil en 5 minutes pour rejoindre WiggMap Connect.</p>' +
        '<a href="onboarding.html" class="btn btn--primary btn--full" style="font-size:15px;height:50px;">' +
          'Créer mon profil' +
        '</a>' +
      '</div>';
    return;
  }

  /* -------------------------------------------------------
     Build trajectory line — 4 situations
     ------------------------------------------------------- */
  function buildTrajectory(p) {
    var originFlag  = WC.getFlag(p.country_origin  || '');
    var currentFlag = WC.getFlag(p.country_current || p.country_origin || '');
    var targetFlag  = p.country_targets && p.country_targets[0]
                        ? WC.getFlag(p.country_targets[0]) : '🌍';

    var originCity  = esc(p.origin_city  || p.origin_name  || 'Origine');
    var currentCity = esc(p.current_city || p.current_name || 'Ville');
    var targetName  = esc(p.targets_data && p.targets_data[0]
                            ? p.targets_data[0].name
                            : (p.country_targets && p.country_targets[0]) || 'À définir');

    var sit = p.situation || 'curious';

    if (sit === 'curious') {
      // "🇫🇷 Lyon · En exploration"
      return originFlag + ' ' + originCity + ' · En exploration';
    }
    if (sit === 'thinking') {
      // "🇫🇷 Lyon → 🌍 À définir"
      return originFlag + ' ' + originCity + ' → ' + targetFlag + ' À définir';
    }
    if (sit === 'confirmed') {
      // "🇫🇷 Lyon → 🇵🇹 Porto · Départ T3 2026"
      return originFlag + ' ' + originCity + ' → ' + targetFlag + ' ' + targetName + ' · Départ T3 2026';
    }
    // installed / settled / veteran / transition
    var months = p.months_there || 14;
    // "🇫🇷 Lyon → 🇵🇹 Porto · 14 mois"
    return originFlag + ' ' + originCity + ' → ' + currentFlag + ' ' + currentCity + ' · ' + months + ' mois';
  }

  /* -------------------------------------------------------
     Cover gradient — based on country
     ------------------------------------------------------- */
  var COVER_GRADIENTS = {
    'portugal':      'linear-gradient(135deg, #006600 0%, #ff0000 50%, #1a4c1a 100%)',
    'france':        'linear-gradient(135deg, #002395 0%, #f0f0f0 50%, #ED2939 100%)',
    'thailand':      'linear-gradient(135deg, #A51931 0%, #F4F5F8 40%, #2D2A4A 100%)',
    'japan':         'linear-gradient(135deg, #BC002D 0%, #fff 60%, #BC002D 100%)',
    'germany':       'linear-gradient(135deg, #000 0%, #D00 50%, #FFCE00 100%)',
    'spain':         'linear-gradient(135deg, #c60b1e 0%, #ffc400 50%, #c60b1e 100%)',
    'brazil':        'linear-gradient(135deg, #009c3b 0%, #ffdf00 50%, #002776 100%)',
    'canada':        'linear-gradient(135deg, #d52b1e 0%, #fff 40%, #d52b1e 100%)',
    'united-states': 'linear-gradient(135deg, #3c3b6e 0%, #B22234 50%, #fff 100%)',
    'australia':     'linear-gradient(135deg, #00008b 0%, #cc0000 50%, #fff 100%)',
    'default':       'linear-gradient(135deg, #0d1a2e 0%, #1a3a5c 50%, #0d2a1a 100%)',
  };

  function getCoverGradient(p) {
    var key = p.country_current || (p.country_targets && p.country_targets[0]) || '';
    return COVER_GRADIENTS[key] || COVER_GRADIENTS['default'];
  }

  /* -------------------------------------------------------
     Avatar HTML
     ------------------------------------------------------- */
  function buildAvatar(p) {
    var initials = (p.display_name || 'U')
      .split(' ').map(function(w){ return w[0]; }).join('').toUpperCase().slice(0, 2);
    var inner = p.avatar_url
      ? '<img src="' + esc(p.avatar_url) + '" alt="' + esc(p.display_name) + '" />'
      : initials;
    return '<div class="prof-avatar">' + inner + '<span class="prof-avatar__dot"></span></div>';
  }

  /* -------------------------------------------------------
     Sector label
     ------------------------------------------------------- */
  function getSectorLabel(p) {
    if (p.sector_label) return esc(p.sector_label);
    if (p.sector) {
      var def = WC.SECTORS.find(function(s){ return s.id === p.sector; });
      return def ? esc(def.label) : esc(p.sector);
    }
    return '';
  }

  /* -------------------------------------------------------
     Specialties / help topics as tags
     ------------------------------------------------------- */
  function buildTags(p) {
    var topics = p.help_topics || [];
    if (!topics.length) return '';
    var topicDefs = WC.WC_HELP_TOPICS || [];
    var tags = topics.slice(0, 5).map(function(tid) {
      var def = topicDefs.find(function(t){ return t.id === tid; });
      return '<span class="prof-tag">✦ ' + esc(def ? def.label : tid) + '</span>';
    });
    return '<div class="prof-tags">' + tags.join('') + '</div>';
  }

  /* -------------------------------------------------------
     Status pill
     ------------------------------------------------------- */
  function buildStatusPill(p) {
    var sid = p.life_status || '';
    var def = WC.LIFE_STATUSES.find(function(s){ return s.id === sid; });
    if (!def) return '';
    var open = ['curious', 'planning', 'transition'].includes(sid);
    return '<div class="pill' + (open ? ' pill--open' : '') + '" style="display:inline-flex;">' +
           esc(def.icon || '') + ' ' + esc(def.label) + '</div>';
  }

  /* -------------------------------------------------------
     Languages rows
     ------------------------------------------------------- */
  function buildLangs(p) {
    var langs = p.languages || [];
    if (!langs.length) return '<p style="font-size:12px;color:var(--wigg-text-4);padding:8px 0;">Non renseigné</p>';
    return langs.map(function(l) {
      var id  = l.lang || l.id;
      var def = WC.LANGUAGES.find(function(x){ return x.id === id; });
      var lbl = def ? def.label : id;
      var flg = def ? def.flag : '';
      var lvl = l.level || 3;
      var dots = [1,2,3,4,5].map(function(n){
        return '<span class="lang-dot' + (n <= lvl ? ' on' : '') + '"></span>';
      }).join('');
      return '<div class="lang-row">' +
               '<span style="font-size:18px;">' + flg + '</span>' +
               '<span style="flex:1;color:var(--wigg-text-1);">' + esc(lbl) + '</span>' +
               '<div class="lang-dot-row">' + dots + '</div>' +
             '</div>';
    }).join('');
  }

  /* -------------------------------------------------------
     Determine tab order (Journal first if installed/veteran)
     ------------------------------------------------------- */
  var sit = profile.situation || 'curious';
  var showJournalFirst = ['installed', 'veteran', 'returned', 'settled'].includes(sit) ||
                         ['settled', 'veteran', 'returned', 'transition'].includes(profile.life_status);

  var tabs = showJournalFirst
    ? ['journal', 'reels', 'posts', 'infos']
    : ['reels', 'posts', 'journal', 'infos'];

  var tabLabels = {
    journal: 'Journal',
    reels:   'Reels',
    posts:   'Posts',
    infos:   'Infos',
  };

  /* -------------------------------------------------------
     Mock journal entries (based on target country)
     ------------------------------------------------------- */
  var targetCountry = (profile.targets_data && profile.targets_data[0])
    ? profile.targets_data[0].name
    : (profile.country_targets && profile.country_targets[0]) || 'Portugal';
  var targetFlag = profile.country_targets && profile.country_targets[0]
    ? WC.getFlag(profile.country_targets[0]) : '🌍';

  function buildJournalPanel() {
    return '<div class="journal-series">' +
             '<div class="journal-series__header">' +
               '<div class="journal-series__flag">' + targetFlag + '</div>' +
               '<div class="journal-series__meta">' +
                 '<div class="journal-series__title">Mon déménagement à ' + esc(targetCountry) + '</div>' +
                 '<div class="journal-series__sub">3 épisodes · En cours</div>' +
               '</div>' +
             '</div>' +
             '<div class="journal-progress-track">' +
               '<div class="journal-progress-fill" style="width:40%;"></div>' +
             '</div>' +
             '<div class="journal-series__episodes">2/5 épisodes publiés</div>' +
           '</div>' +
           '<div class="journal-entry-preview">' +
             '<div class="journal-entry-preview__date">Il y a 3 jours</div>' +
             '<div class="journal-entry-preview__text">' +
               'Premier contact avec le consulat — les délais sont plus longs que prévu, ' +
               'mais la procédure est claire une fois qu\'on a tous les documents.' +
             '</div>' +
           '</div>' +
           '<div class="journal-entry-preview">' +
             '<div class="journal-entry-preview__date">Il y a 2 semaines</div>' +
             '<div class="journal-entry-preview__text">' +
               'Visite de repérage à ' + esc(targetCountry) + ' — les quartiers Nord sont vraiment accessibles ' +
               'par rapport à Paris. J\'ai visité 4 apparts en 2 jours.' +
             '</div>' +
           '</div>';
  }

  function buildReelsPanel() {
    var colors = ['#1a3a2a','#2a1a3a','#1a2a3a','#3a2a1a','#1a3a3a','#2a3a1a'];
    var durs   = ['0:42','1:15','0:58','2:03','0:31','1:47'];
    return '<div class="reels-grid">' +
      colors.map(function(c, i) {
        return '<div class="reel-thumb">' +
                 '<div class="reel-thumb__bg" style="background:' + c + ';height:100%;"></div>' +
                 '<span class="reel-thumb__dur">' + durs[i] + '</span>' +
               '</div>';
      }).join('') +
    '</div>';
  }

  function buildPostsPanel() {
    var posts = [
      {
        date: 'Il y a 5 jours',
        text: 'Question sur le visa D7 — quelqu\'un a tenté la procédure en ligne ? ' +
              'L\'ambassade de France répond mal aux mails.',
        helped: 4,
      },
      {
        date: 'Il y a 12 jours',
        text: 'Retour après ma première semaine ici. Le coût de la vie est vraiment ' +
              'différent de ce qu\'on lit sur les forums.',
        helped: 7,
      },
    ];
    return posts.map(function(p, i) {
      return '<div class="post-item">' +
               '<div class="post-item__date">' + p.date + '</div>' +
               '<div class="post-item__text">' + esc(p.text) + '</div>' +
               '<div class="post-item__actions">' +
                 '<button class="helped-btn" onclick="togglePostHelped(this,' + i + ')">' +
                   '✦ Aidé <span class="helped-count">' + p.helped + '</span>' +
                 '</button>' +
               '</div>' +
             '</div>';
    }).join('');
  }

  function buildInfosPanel(p) {
    var memberDate = '';
    if (p.created_at) {
      var d = new Date(p.created_at);
      memberDate = d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    }
    var typeLabels = { individu: '🧑 Individu', commerce: '🏪 Commerce', association: '🤲 Association' };
    var typeLabel  = typeLabels[p.member_type] || '🧑 Individu';

    return '<div class="info-block">' +
             '<div class="info-block__title">Profil</div>' +
             (memberDate
               ? '<div class="info-row"><span class="info-row__icon">📅</span><span class="info-row__label">Membre depuis</span><span class="info-row__val">' + esc(memberDate) + '</span></div>'
               : '') +
             '<div class="info-row"><span class="info-row__icon">👤</span><span class="info-row__label">Type</span><span class="info-row__val">' + typeLabel + '</span></div>' +
             (getSectorLabel(p)
               ? '<div class="info-row"><span class="info-row__icon">💼</span><span class="info-row__label">Secteur</span><span class="info-row__val">' + getSectorLabel(p) + '</span></div>'
               : '') +
           '</div>' +
           '<div class="info-block">' +
             '<div class="info-block__title">Langues</div>' +
             buildLangs(p) +
           '</div>' +
           (p.country_targets && p.country_targets.length
             ? '<div class="info-block">' +
                 '<div class="info-block__title">Destinations</div>' +
                 '<div style="display:flex;flex-wrap:wrap;gap:6px;">' +
                   (p.targets_data || p.country_targets.map(function(s){ return {slug:s, name:s}; }))
                     .map(function(t) {
                       return '<div class="pill">' + WC.getFlag(t.slug) + ' ' + esc(t.name) + '</div>';
                     }).join('') +
                 '</div>' +
               '</div>'
             : '');
  }

  /* -------------------------------------------------------
     Build tabs HTML
     ------------------------------------------------------- */
  function buildTabsHTML() {
    var btns = tabs.map(function(tid, i) {
      return '<button class="prof-tab' + (i === 0 ? ' active' : '') + '" ' +
               'onclick="switchProfTab(\'' + tid + '\')" id="ptab-' + tid + '">' +
               tabLabels[tid] +
             '</button>';
    }).join('');

    var panels = tabs.map(function(tid, i) {
      var content = '';
      if (tid === 'journal') content = buildJournalPanel();
      if (tid === 'reels')   content = buildReelsPanel();
      if (tid === 'posts')   content = buildPostsPanel();
      if (tid === 'infos')   content = buildInfosPanel(profile);
      return '<div class="prof-panel' + (i === 0 ? ' active' : '') + '" id="ppanel-' + tid + '">' +
               content +
             '</div>';
    }).join('');

    return '<div class="prof-tabs">' + btns + '</div>' + panels;
  }

  /* -------------------------------------------------------
     Render everything
     ------------------------------------------------------- */
  var coverGradient  = getCoverGradient(profile);
  var trajectory     = buildTrajectory(profile);
  var memberDate     = '';
  if (profile.created_at) {
    var d = new Date(profile.created_at);
    memberDate = d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  }

  root.innerHTML =

    /* Cover */
    '<div class="prof-cover" style="background:' + coverGradient + ';">' +
      '<div class="prof-cover__overlay"></div>' +
      '<a href="onboarding.html" class="prof-cover__edit" data-wci18n="profile.edit">Modifier</a>' +
    '</div>' +

    /* Avatar row */
    '<div class="prof-avatar-row">' +
      buildAvatar(profile) +
    '</div>' +

    /* Identity */
    '<div class="prof-identity">' +
      '<div class="prof-traj">' + trajectory + '</div>' +
      '<div class="prof-name">' + esc(profile.display_name) + '</div>' +
      '<div class="prof-meta">' +
        (getSectorLabel(profile) || '') +
        (getSectorLabel(profile) && memberDate ? ' · ' : '') +
        (memberDate ? 'Membre ' + memberDate : '') +
      '</div>' +
      buildStatusPill(profile) +
      (profile.bio
        ? '<p class="prof-bio">' + esc(profile.bio) + '</p>'
        : '<p class="prof-bio" style="color:var(--wigg-text-4);">Aucune bio renseignée.</p>') +
      buildTags(profile) +
    '</div>' +

    /* Action buttons */
    '<div class="prof-actions">' +
      '<button class="prof-btn prof-btn--primary" onclick="toggleFollow(this)" data-wci18n="btn.follow">+ Suivre</button>' +
      '<button class="prof-btn prof-btn--ghost" data-wci18n="btn.message">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
          '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' +
        '</svg>' +
        'Message' +
      '</button>' +
      '<button class="prof-btn prof-btn--compat" onclick="showCompat()" data-wci18n="btn.compat">~ Compat.</button>' +
    '</div>' +

    /* Stats */
    '<div class="prof-stats">' +
      '<div class="prof-stat"><div class="prof-stat__val">0</div><div class="prof-stat__lbl" data-wci18n="status.helped">aidés</div></div>' +
      '<div class="prof-stat"><div class="prof-stat__val">0</div><div class="prof-stat__lbl" data-wci18n="status.recognized">reconnu</div></div>' +
      '<div class="prof-stat"><div class="prof-stat__val">0</div><div class="prof-stat__lbl" data-wci18n="status.meetings">rencontres</div></div>' +
      '<div class="prof-stat"><div class="prof-stat__val">0</div><div class="prof-stat__lbl" data-wci18n="status.mirrors">WiggZ</div></div>' +
    '</div>' +

    /* Separator */
    '<div class="prof-sep"></div>' +

    /* Tabs */
    buildTabsHTML();

  /* Re-apply i18n after rendering dynamic content */
  if (typeof wcApplyLang === 'function') {
    wcApplyLang(localStorage.getItem('wigg_lang') || 'en');
  }

  /* -------------------------------------------------------
     Tab switcher
     ------------------------------------------------------- */
  window.switchProfTab = function(tid) {
    document.querySelectorAll('.prof-tab').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.prof-panel').forEach(function(p) { p.classList.remove('active'); });
    var btn   = document.getElementById('ptab-'   + tid);
    var panel = document.getElementById('ppanel-' + tid);
    if (btn)   btn.classList.add('active');
    if (panel) panel.classList.add('active');
  };

  /* -------------------------------------------------------
     Follow toggle
     ------------------------------------------------------- */
  window.toggleFollow = function(btn) {
    var following = btn.getAttribute('data-following') === '1';
    if (following) {
      btn.textContent = '+ Suivre';
      btn.style.background = 'var(--wigg-green)';
      btn.style.color = '#0a0f1e';
      btn.removeAttribute('data-following');
    } else {
      btn.textContent = '✓ Suivi';
      btn.style.background = 'none';
      btn.style.border = '0.5px solid var(--wigg-green)';
      btn.style.color = 'var(--wigg-green)';
      btn.setAttribute('data-following', '1');
      window.showToast('Profil suivi ✓', 'success');
    }
  };

  /* -------------------------------------------------------
     Compat
     ------------------------------------------------------- */
  window.showCompat = function() {
    window.showToast('Score de compatibilité disponible bientôt 🔜');
  };

  /* -------------------------------------------------------
     Post helped toggle
     ------------------------------------------------------- */
  window.togglePostHelped = function(btn, idx) {
    var countEl = btn.querySelector('.helped-count');
    var helped  = btn.getAttribute('data-helped') === '1';
    var n       = parseInt(countEl.textContent, 10) || 0;
    if (helped) {
      countEl.textContent = n - 1;
      btn.removeAttribute('data-helped');
    } else {
      countEl.textContent = n + 1;
      btn.setAttribute('data-helped', '1');
      window.showToast('✦ Aidé !', 'success', 1500);
    }
  };

})();
</script>
<script src="assets/i18n.js"></script>
<script>(function(){ wcApplyLang(localStorage.getItem('wigg_lang')||'en'); })();</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof wcInitLangSwitcher === 'function') {
      wcInitLangSwitcher();
    }
  });
</script>
</body>
</html>
