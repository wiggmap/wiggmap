<!-- Barre retour -->

</div>

<!-- Header principal -->
<header style="display:flex; align-items:center; justify-content:center;
               position:relative; padding:10px 16px; background:#0a0f1e;
               border-bottom:0.5px solid #1e2a3a;">

         style="height:52px; width:auto; display:block;"
         alt="WiggMap Connect" />
  </a>
  <div style="position:absolute; right:16px; top:50%; transform:translateY(-50%);"
       id="wcLangWrap">
    <button id="wcLangBtn"
            onclick="document.getElementById('wcLangDd').style.display=
                     document.getElementById('wcLangDd').style.display==='block'?'none':'block'"
            style="background:none; border:0.5px solid #1e2a3a; border-radius:20px;
                   padding:5px 12px; font-size:12px; font-weight:500;
                   color:#22c55e; cursor:pointer;"></button>
    <div id="wcLangDd"
         style="display:none; position:absolute; right:0; top:calc(100% + 6px);
                background:#0d1629; border:0.5px solid #1e2a3a; border-radius:10px;
                overflow:hidden; min-width:60px; z-index:999;"></div>
  </div>
</header>

<!-- Titre -->
<div class="swipe-header">
  <div class="swipe-title">Explorer des vies que tu envisages</div>
  <div class="swipe-subtitle">Profils triés par activité récente · Miroirs en tête de liste</div>
  <div class="swipe-counter" id="swipeCounter" style="text-align:left;padding:0;margin-top:4px;"></div>
</div>

<!-- Card stack -->
<div class="swipe-stage">
  <!-- Shadow hint — profil suivant -->
  <div class="swipe-stack-hint swipe-stack-hint-2"></div>
  <div class="swipe-stack-hint"></div>
  <!-- Card principale -->
  <div id="swipeCard"></div>
</div>

<!-- Actions -->
<div class="swipe-actions" id="swipeActions">
  <button class="swipe-btn swipe-btn--pass" onclick="handleSwipe('pass')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
    Passer
  </button>
  <button class="swipe-btn swipe-btn--follow" onclick="handleSwipe('follow')">
    ✦ Suivre
  </button>
  <button class="swipe-btn swipe-btn--profile" onclick="handleSwipe('profile')">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    Profil
  </button>
</div>

<!-- Bottom nav -->

    <span class="connect-bottombar__label">Feed</span>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

    <span class="connect-bottombar__label">Profil</span>

  {

  },

/* ============================================================
   État
   ============================================================ */
var state = {
  currentIndex: 0,
  followed: [],
  passed: [],
};

/* ============================================================
   Rendu
   ============================================================ */
function renderCard() {
  var cardEl     = document.getElementById('swipeCard');
  var actionsEl  = document.getElementById('swipeActions');
  var counterEl  = document.getElementById('swipeCounter');
  var remaining  = PROFILES.length - state.currentIndex;

  counterEl.textContent = remaining + ' profil' + (remaining > 1 ? 's' : '') + ' restant' + (remaining > 1 ? 's' : '');

  if (state.currentIndex >= PROFILES.length) {
    // État vide
    cardEl.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state__icon">✦</div>' +
        '<div class="empty-state__title">Tu as tout vu !</div>' +
        '<p class="empty-state__sub">Tu as parcouru tous les profils disponibles.<br>Reviens demain — de nouvelles personnes s\'installent chaque jour.</p>' +
        '<a href="group.html" class="btn btn--primary btn--sm" style="font-size:12px;">Explorer les groupes pays</a>' +
      '</div>';
    actionsEl.style.visibility = 'hidden';
    counterEl.textContent = '';
    // Cacher les shadow hints
    document.querySelectorAll('.swipe-stack-hint').forEach(function(el){ el.style.display = 'none'; });
    return;
  }

  var p = PROFILES[state.currentIndex];
  var mirrorHTML = p.mirror >= 50
    ? '<div class="swipe-card__mirror-row">' +
        '<span class="swipe-mirror-label">Score miroir</span>' +
        '<span class="swipe-mirror-badge">🔀 ' + p.mirror + '/100</span>' +
      '</div>'
    : '';

  var highlightText = '';
  if (p.highlight.type === 'journal') {
    highlightText = '📖 ' + p.highlight.text;
  } else if (p.highlight.type === 'expertise') {
    highlightText = '✦ ' + p.highlight.text;
  } else if (p.highlight.type === 'depart') {
    highlightText = '🗓 ' + p.highlight.text;
  }

  cardEl.innerHTML =
    '<div class="swipe-card">' +

      /* Cover */
      '<div class="swipe-card__cover">' +
        '<div class="swipe-card__cover-bg" style="background:' + p.bg + ';"></div>' +
        '<div class="swipe-card__cover-overlay"></div>' +
        '<div class="swipe-card__traj">' + p.traj + '</div>' +
      '</div>' +

      /* Body */
      '<div class="swipe-card__body">' +

        '<div class="swipe-card__name">' +
          '<div style="display:inline-flex;align-items:center;justify-content:center;' +
               'width:32px;height:32px;border-radius:50%;background:' + p.avatarBg + ';' +
               'color:' + p.avatarColor + ';font-size:12px;font-weight:700;' +
               'border:0.5px solid #1e2a3a;margin-right:8px;vertical-align:middle;">' +
            p.initials +
          '</div>' +
          p.name +
        '</div>' +

        '<div class="swipe-card__status-row">' +
          '<span class="pill">' + p.status + '</span>' +
          (p.sector ? '<span class="text-caption">' + getSectorLabel(p.sector) + '</span>' : '') +
        '</div>' +

        '<div class="swipe-card__bio">' + escapeHTML(p.bio) + '</div>' +

        '<div class="swipe-card__highlight">' +
          '<strong>' + highlightText + '</strong>' +
        '</div>' +

        mirrorHTML +

      '</div>' +
    '</div>';
}

function getSectorLabel(sectorId) {
  var map = {
    tech: 'Tech', finance: 'Finance', health: 'Santé', law: 'Droit',
    'real-estate': 'Immobilier', creative: 'Création', education: 'Éducation',
    trade: 'Commerce', hospitality: 'Hôtellerie', other: 'Autre',
  };
  return map[sectorId] || sectorId;
}

function escapeHTML(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ============================================================
   Actions
   ============================================================ */
function handleSwipe(action) {
  var p = PROFILES[state.currentIndex];
  if (!p) return;

  if (action === 'pass') {
    state.passed.push(p.id);
    if (typeof showToast === 'function') showToast('Passé →');
    animateOut('right');
  } else if (action === 'follow') {
    state.followed.push(p.id);
    if (typeof showToast === 'function') showToast('✦ Tu suis maintenant ' + p.name, 'success');
    animateOut('left');
  } else if (action === 'profile') {
    // MVP : redirige vers profile.html (future: profile.html?id=...)
    window.location.href = 'profile.html';
    return;
  }

  state.currentIndex++;
  setTimeout(renderCard, 220);
}

function animateOut(dir) {
  var card = document.getElementById('swipeCard');
  if (!card) return;
  var x = dir === 'right' ? '120%' : '-120%';
  card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
  card.style.transform  = 'translateX(' + x + ')';
  card.style.opacity    = '0';
}

/* ============================================================
   Touch / swipe gesture (mobile)
   ============================================================ */
(function() {
  var startX = 0;
  var isDragging = false;

  document.addEventListener('touchstart', function(e) {
    var stage = document.getElementById('swipeCard');
    if (!stage) return;
    startX = e.touches[0].clientX;
    isDragging = true;
    stage.style.transition = 'none';
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!isDragging) return;
    var stage = document.getElementById('swipeCard');
    if (!stage) return;
    var dx = e.touches[0].clientX - startX;
    stage.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx * 0.03) + 'deg)';
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (!isDragging) return;
    isDragging = false;
    var stage = document.getElementById('swipeCard');
    if (!stage) return;
    var dx = e.changedTouches[0].clientX - startX;
    if (dx > 80) {
      handleSwipe('follow');
    } else if (dx < -80) {
      handleSwipe('pass');
    } else {
      stage.style.transition = 'transform 0.2s ease';
      stage.style.transform  = '';
    }
  }, { passive: true });
})();

/* ============================================================
   Init
   ============================================================ */
document.addEventListener('DOMContentLoaded', function() {
  renderCard();
  if (typeof wcInitLangSwitcher === 'function') wcInitLangSwitcher();
});
</script>
