  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1a5430;--ink:#171714;--ink-soft:#54554e;--bg:#f5f0e8;--paper:#fffdf8;--border:#c8bfaa;--muted:#8a7f6a;--ghost:#b0a898}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100svh;min-height:100dvh}

.ob-wrap{max-width:560px;margin:0 auto;padding:40px 24px 80px}
.ob-title{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:800;text-align:center;margin-bottom:6px}
.ob-sub{text-align:center;font-size:14px;color:var(--muted);margin-bottom:32px}

/* Steps */
.ob-step{background:var(--paper);border:1px solid var(--border);border-radius:2px;padding:24px 22px;margin-bottom:18px}
.ob-step-title{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.ob-step-num{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}

/* Fields */
.ob-field{margin-bottom:14px}
.ob-label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.02em}
.ob-label .req{color:#c0392b}
.ob-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:2px;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:#fff;transition:border-color .15s}
.ob-input:focus{outline:none;border-color:var(--green)}

/* Avatar */
.ob-avatar-row{display:flex;align-items:center;gap:14px}
.ob-avatar-preview{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1);flex-shrink:0}
.ob-avatar-preview img{width:100%;height:100%;object-fit:cover}
.ob-avatar-upload{font-size:12px;color:var(--green);font-weight:600;cursor:pointer;text-decoration:underline}

/* Pills */
.ob-pills{display:flex;flex-wrap:wrap;gap:8px}
.ob-pill{padding:8px 14px;border:1px solid var(--border);border-radius:2px;font-size:13px;font-weight:500;color:var(--ink-soft);background:var(--paper);cursor:pointer;transition:border-color .15s,background .15s,color .15s;user-select:none}
.ob-pill:hover{border-color:var(--green);color:var(--green)}
.ob-pill.selected{background:var(--green);color:#fff;border-color:var(--green)}
.ob-pill-multi.selected{background:#d4e8d0;color:var(--green);border-color:var(--green)}

/* Submit */
.ob-submit{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:2px;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;margin-top:8px}
.ob-submit:hover{background:#145228}
.ob-submit:disabled{background:var(--ghost);cursor:not-allowed}
.ob-error{font-size:13px;color:#c0392b;text-align:center;margin-top:10px;min-height:20px}

@media(max-width:500px){.ob-wrap{padding:24px 14px 60px}.ob-step{padding:18px 16px}}
  </style>

  // ── Translate Supabase errors ──
  function friendlyErr(err) {
    if (!err) return '';
    var m = (err.message || '').toLowerCase();
    if (m.indexOf('invalid login') !== -1 || m.indexOf('invalid_credentials') !== -1) return T.errInvalidCreds;
    if (m.indexOf('email not confirmed') !== -1) return T.errEmailNotConfirmed;
    if (m.indexOf('already registered') !== -1) return T.errAlreadyRegistered;
    if (m.indexOf('weak password') !== -1 || m.indexOf('password should') !== -1) return T.errWeakPw;
    if (m.indexOf('rate') !== -1) return T.errRate;
    return err.message || T.errGeneric;
  }

  // ── Load Supabase ──
  function loadSB(cb) {
    if (window.supabase) { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { detectSessionInUrl: true, persistSession: true } }); return cb(); }
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    s.onload = function() { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { detectSessionInUrl: true, persistSession: true } }); cb(); };
    document.head.appendChild(s);
  }

  // ── Load countries ──
  function loadCountries(cb) {
    var url = '/data/countries.json';
    if (LANG === 'fr') url = '/data/countries.fr.json';
    else if (LANG === 'es') url = '/data/countries.es.json';
    fetch(url).then(function(r){ return r.ok ? r.json() : fetch('/data/countries.json').then(function(r2){return r2.json();}); }).then(function(data){
      countriesData = data;
      cb();
    }).catch(function(){
      fetch('/data/countries.json').then(function(r){return r.json();}).then(function(d){ countriesData = d; cb(); });
    });
  }

  // ── Country autocomplete ──
  function setupCountryInput(inputId, listId, onSelect) {
    var input = document.getElementById(inputId);
    var list = document.getElementById(listId);
    if (!input || !list) return;

    input.addEventListener('input', function() {
      var q = input.value.trim().toLowerCase();
      list.innerHTML = '';
      if (q.length < 1) { list.style.display = 'none'; return; }
      var matches = [];
      for (var slug in countriesData) {
        var c = countriesData[slug];
        var name = c.name || '';
        var aliases = c.aliases || [];
        var found = name.toLowerCase().indexOf(q) !== -1;
        if (!found) { for (var i = 0; i < aliases.length; i++) { if (aliases[i].toLowerCase().indexOf(q) !== -1) { found = true; break; } } }
        if (found) matches.push({ slug: slug, name: name });
      }
      matches.sort(function(a,b){ return a.name.localeCompare(b.name); });
      matches = matches.slice(0, 10);
      if (matches.length === 0) { list.style.display = 'none'; return; }
      list.style.display = 'block';
      matches.forEach(function(m) {
        var item = document.createElement('div');
        item.style.cssText = 'padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0ede4;';
        item.textContent = m.name;
        item.onmouseover = function(){ item.style.background='#f0ede4'; };
        item.onmouseout = function(){ item.style.background='#fff'; };
        item.onclick = function() {
          input.value = m.name;
          list.style.display = 'none';
          onSelect(m.slug);
        };
        list.appendChild(item);
      });
    });

    document.addEventListener('click', function(e) {
      if (!input.contains(e.target) && !list.contains(e.target)) list.style.display = 'none';
    });
  }

  // ── Pills (single select) ──

    var container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll('.ob-pill').forEach(function(pill) {
      pill.addEventListener('click', function() {
        container.querySelectorAll('.ob-pill').forEach(function(p){ p.classList.remove('selected'); });
        pill.classList.toggle('selected');
        onSelect(pill.classList.contains('selected') ? pill.dataset.val : null);
      });
    });
  }

  // ── Pills (multi select) ──
  function setupMultiPills(containerId, arr) {
    var container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll('.ob-pill-multi').forEach(function(pill) {
      pill.addEventListener('click', function() {
        pill.classList.toggle('selected');
        arr.length = 0;
        container.querySelectorAll('.ob-pill-multi.selected').forEach(function(p){ arr.push(p.dataset.val); });
      });
    });
  }

  // ── Avatar preview (compressed to 256x256 JPEG) ──
  function setupAvatar() {
    var fileInput = document.getElementById('obAvatarFile');
    var preview = document.getElementById('obAvatarPreview');
    if (!fileInput || !preview) return;
    fileInput.addEventListener('change', function() {
      var file = fileInput.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        document.getElementById('obError').textContent = T.errImageSize;
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var size = 256;
          var scale = Math.min(size / img.width, size / img.height, 1);
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          avatarDataUrl = canvas.toDataURL('image/jpeg', 0.85);
          preview.innerHTML = '<img src="' + avatarDataUrl + '" alt="">';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ── Prefill from session ──
  function prefillFromSession(session) {
    if (!session || !session.user) return;
    var u = session.user;
    var meta = u.user_metadata || {};
    var name = meta.full_name || meta.name || '';
    var avatar = meta.avatar_url || meta.picture || '';

    var usernameInput = document.getElementById('obUsername');
    var preview = document.getElementById('obAvatarPreview');

    if (usernameInput && name && !usernameInput.value) {
      usernameInput.value = name.split(' ')[0];
    }
    if (preview && avatar) {
      preview.innerHTML = '<img src="' + avatar + '" alt="">';
      avatarDataUrl = avatar;
    }
  }

  // ── Submit ──
  function setupSubmit() {
    var btn = document.getElementById('obSubmit');
    var errEl = document.getElementById('obError');
    if (!btn) return;

    btn.addEventListener('click', function() {
      errEl.style.color = '#c0392b';
      errEl.textContent = '';
      var username = (document.getElementById('obUsername').value || '').trim();
      if (!username) { errEl.textContent = T.errUsername; return; }
      if (!selectedCountryOrigin) { errEl.textContent = T.errCountryOrigin; return; }
      if (!selectedLifeStatus) { errEl.textContent = T.errLifeStatus; return; }

      btn.disabled = true;
      btn.textContent = T.submitting;

      sb.auth.getSession().then(function(res) {
        var session = res.data.session;
        if (!session) {
          errEl.textContent = T.errSession;
          btn.disabled = false;
          btn.textContent = T.submit;
          return;
        }

        var payload = {
          id: session.user.id,
          username: username,
          avatar_url: avatarDataUrl || (session.user.user_metadata || {}).avatar_url || null,
          country_origin: selectedCountryOrigin,
          life_status: selectedLifeStatus,
          country_current: selectedCountryCurrent || null,
          country_target: selectedCountryTarget || null,
          sector: selectedSector || null,
          languages: selectedLanguages.length > 0 ? selectedLanguages : [],
          onboarding_done: true
        };

        sb.from('profiles').upsert(payload, { onConflict: 'id' }).then(function(r) {
          if (r.error) {
            errEl.style.color = '#c0392b';
            errEl.textContent = friendlyErr(r.error);
            btn.disabled = false;
            btn.textContent = T.submit;
            return;
          }
          var params = new URLSearchParams(window.location.search);
          var from = params.get('from');
          if (window.wmhRefreshAuth) try { window.wmhRefreshAuth(); } catch(e){}
          window.location.href = from || '/mon-compte.html';
        });
      });
    });
  }

  // ── Inline login screen ──
  function showLoginScreen() {
    document.getElementById('obWrap').innerHTML =
      '<h1 class="ob-title">' + T.loginTitle + '</h1>' +
      '<p class="ob-sub">' + T.loginSub + '</p>' +
      '<div class="ob-step">' +
        '<button id="lgGoogle" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;background:#fff;border:1px solid #c8bfaa;border-radius:2px;font-family:Inter,sans-serif;font-size:14px;font-weight:600;color:#1a1208;cursor:pointer;margin-bottom:14px">' +
          '<svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>' +
          T.loginGoogle + '</button>' +
        '<div style="display:flex;align-items:center;gap:12px;color:#b0a898;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:14px 0">' +
          '<span style="flex:1;height:1px;background:#c8bfaa"></span>' + T.orSep + '<span style="flex:1;height:1px;background:#c8bfaa"></span>' +
        '</div>' +
        '<input id="lgEmail" type="email" placeholder="' + T.emailPlaceholder + '" autocomplete="email" class="ob-input" style="margin-bottom:8px">' +
        '<input id="lgPw" type="password" placeholder="' + T.pwPlaceholder + '" autocomplete="current-password" class="ob-input" style="margin-bottom:8px">' +
        '<div id="lgErr" style="font-size:12px;color:#c0392b;min-height:16px;margin-bottom:8px"></div>' +
        '<button id="lgSubmit" class="ob-submit" style="margin-top:0">' + T.loginBtn + '</button>' +
        '<div id="lgToggleRow" style="text-align:center;font-size:12px;color:#8a7f6a;margin-top:12px">' + T.noAccount + '<a href="#" id="lgToggle" style="color:#1a5430;font-weight:600">' + T.noAccountLink + '</a></div>' +
      '</div>';

    var mode = 'login';
    var emailInput = document.getElementById('lgEmail');
    var pwInput = document.getElementById('lgPw');
    var errEl = document.getElementById('lgErr');
    var submitBtn = document.getElementById('lgSubmit');
    var googleBtn = document.getElementById('lgGoogle');
    var toggleRow = document.getElementById('lgToggleRow');

    googleBtn.onclick = function() {
      sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
    };

    function bindToggle() {
      var link = document.getElementById('lgToggle');
      if (!link) return;
      link.onclick = function(e) {
        e.preventDefault();
        mode = mode === 'login' ? 'signup' : 'login';
        submitBtn.textContent = mode === 'login' ? T.loginBtn : T.signupBtn;
        toggleRow.innerHTML = mode === 'login'
          ? T.noAccount + '<a href="#" id="lgToggle" style="color:#1a5430;font-weight:600">' + T.noAccountLink + '</a>'
          : T.hasAccount + '<a href="#" id="lgToggle" style="color:#1a5430;font-weight:600">' + T.hasAccountLink + '</a>';
        bindToggle();
        errEl.textContent = '';
        errEl.style.color = '#c0392b';
      };
    }
    bindToggle();

    submitBtn.onclick = function() {
      var email = emailInput.value.trim();
      var pw = pwInput.value;
      errEl.style.color = '#c0392b';
      errEl.textContent = '';
      if (!email || !pw) { errEl.textContent = T.errFillAll; return; }
      if (pw.length < 6) { errEl.textContent = T.errPwMin; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = T.submitting;
      var fn = mode === 'signup'
        ? sb.auth.signUp({ email: email, password: pw, options: { emailRedirectTo: window.location.href } })
        : sb.auth.signInWithPassword({ email: email, password: pw });
      fn.then(function(res) {
        submitBtn.disabled = false;
        submitBtn.textContent = mode === 'login' ? T.loginBtn : T.signupBtn;
        if (res.error) { errEl.textContent = friendlyErr(res.error); return; }
        if (mode === 'signup' && !res.data.session) {
          errEl.style.color = '#1a5430';
          errEl.textContent = T.checkInbox;
        }
      });
    };
  }

  // ── Init the form (used after login) ──
  function initOnboarding(session) {
    document.getElementById('obWrap').innerHTML = buildOnboardingHTML();
    loadCountries(function() {
      setupCountryInput('obCountryOrigin', 'obCountryOriginList', function(slug){ selectedCountryOrigin = slug; });
      setupCountryInput('obCountryCurrent', 'obCountryCurrentList', function(slug){ selectedCountryCurrent = slug; });
      setupCountryInput('obCountryTarget', 'obCountryTargetList', function(slug){ selectedCountryTarget = slug; });
      setupPills('obLifeStatus', function(val){ selectedLifeStatus = val; });
      setupPills('obSector', function(val){ selectedSector = val; });
      setupMultiPills('obLanguages', selectedLanguages);
      setupAvatar();
      setupSubmit();
      prefillFromSession(session);
    });
  }

  // ── Prefill existing profile (when editing) ──
  function prefillExistingProfile(userId) {
    sb.from('profiles').select('*').eq('id', userId).maybeSingle().then(function(res) {
      if (!res.data) return;
      var p = res.data;
      if (p.username) document.getElementById('obUsername').value = p.username;
      if (p.country_origin) {
        document.getElementById('obCountryOrigin').value = p.country_origin;
        selectedCountryOrigin = p.country_origin;
      }
      if (p.life_status) {
        selectedLifeStatus = p.life_status;
        document.querySelectorAll('#obLifeStatus .ob-pill').forEach(function(pill) {
          if (pill.dataset.val === p.life_status) pill.classList.add('selected');
        });
      }
      if (p.country_current) {
        document.getElementById('obCountryCurrent').value = p.country_current;
        selectedCountryCurrent = p.country_current;
      }
      if (p.country_target) {
        document.getElementById('obCountryTarget').value = p.country_target;
        selectedCountryTarget = p.country_target;
      }
      if (p.sector) {
        selectedSector = p.sector;
        document.querySelectorAll('#obSector .ob-pill').forEach(function(pill) {
          if (pill.dataset.val === p.sector) pill.classList.add('selected');
        });
      }
      if (p.languages && p.languages.length) {
        selectedLanguages.length = 0;
        p.languages.forEach(function(l) { selectedLanguages.push(l); });
        document.querySelectorAll('#obLanguages .ob-pill-multi').forEach(function(pill) {
          if (p.languages.indexOf(pill.dataset.val) !== -1) pill.classList.add('selected');
        });
      }
      if (p.avatar_url) {
        document.getElementById('obAvatarPreview').innerHTML = '<img src="' + p.avatar_url + '" alt="">';
        avatarDataUrl = p.avatar_url;
      }
    });
  }

  // ── Boot ──
  loadSB(function() {
    sb.auth.getSession().then(function(res) {
      var session = res.data.session;
      if (!session) {
        showLoginScreen();
        sb.auth.onAuthStateChange(function(event, s) {
          if (s && s.user) location.reload();
        });
        return;
      }

      sb.from('profiles').select('onboarding_done').eq('id', session.user.id).maybeSingle().then(function(pRes) {
        if (pRes.data && pRes.data.onboarding_done) {
          var params = new URLSearchParams(window.location.search);
          var from = params.get('from');
          if (from === '/mon-compte.html') {
            initOnboarding(session);
            prefillExistingProfile(session.user.id);
          } else {
            window.location.href = from || '/mon-compte.html';
          }
          return;
        }
        initOnboarding(session);
      });
    });
  });
})();
</script>
